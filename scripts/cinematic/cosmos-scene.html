<!doctype html>
<!--
  ATOMIVID · Ambiente COSMOS (producción propia, sin material de terceros ni proveedores de pago).
  Escena determinista: draw(t) depende solo de t ∈ [0, LOOP). Todo movimiento es periódico en LOOP
  (desplazamientos circulares, giros completos, ciclos de profundidad enteros), así que el último fotograma
  enlaza con el primero sin corte. Lo renderiza scripts/cinematic/render-ambient.cjs.
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const LOOP = 8; // segundos
const TAU = Math.PI * 2;
const c = document.getElementById("c");
const g = c.getContext("2d");

function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// Ruido de valor con octavas (fBm), periódico en la textura para poder desplazarla sin costuras.
function noiseTexture(w, h, seed, palette, octaves = 6) {
  const r = rng(seed);
  const grids = [];
  for (let o = 0; o < octaves; o++) {
    const gw = 4 << o, gh = Math.max(2, Math.round((4 << o) * h / w));
    grids.push({ gw, gh, v: Float32Array.from({ length: gw * gh }, r) });
  }
  const sm = (x) => x * x * (3 - 2 * x);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d"); const img = cx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let n = 0, amp = 0.55, tot = 0;
    for (const { gw, gh, v } of grids) {
      const fx = (x / w) * gw, fy = (y / h) * gh;
      const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = sm(fx - x0), ty = sm(fy - y0);
      const a = v[(y0 % gh) * gw + (x0 % gw)], b = v[(y0 % gh) * gw + ((x0 + 1) % gw)];
      const c2 = v[((y0 + 1) % gh) * gw + (x0 % gw)], d = v[((y0 + 1) % gh) * gw + ((x0 + 1) % gw)];
      n += amp * ((a * (1 - tx) + b * tx) * (1 - ty) + (c2 * (1 - tx) + d * tx) * ty); tot += amp; amp *= 0.55;
    }
    n /= tot;
    const k = Math.max(0, Math.min(1, (n - 0.42) / 0.38)); // nubes densas, huecos oscuros
    const i = (y * w + x) * 4, [pr, pg, pb] = palette(k, n);
    img.data[i] = pr; img.data[i + 1] = pg; img.data[i + 2] = pb; img.data[i + 3] = Math.round(255 * Math.pow(k, 1.6));
  }
  cx.putImageData(img, 0, 0);
  return cv;
}

let W = 0, H = 0, stars = [], nebA = null, nebB = null, planetTex = null;
window.setup = (w, h) => {
  W = c.width = w; H = c.height = h;
  const r = rng(20261124);
  stars = Array.from({ length: 1400 }, () => ({
    x: (r() * 2 - 1), y: (r() * 2 - 1), z0: r(), laps: 1,
    tw: r(), twn: 1 + Math.floor(r() * 3), hue: r(), big: r() < 0.035,
  }));
  // Nebulosa principal: azul medianoche → violeta; secundaria: polvo cálido champagne.
  nebA = noiseTexture(384, 256, 7, (k) => [Math.round(30 + 70 * k), Math.round(48 + 60 * k), Math.round(120 + 110 * k)]);
  nebB = noiseTexture(384, 256, 91, (k) => [Math.round(140 + 90 * k), Math.round(90 + 90 * k), Math.round(120 + 30 * k)]);
  planetTex = noiseTexture(512, 256, 33, (k, n) => [Math.round(18 + 50 * n), Math.round(28 + 60 * n), Math.round(70 + 110 * n)], 5);
};

function glow(cx, cy, rad, rgb, alpha) {
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
  gr.addColorStop(0, `rgba(${rgb},${alpha})`); gr.addColorStop(0.4, `rgba(${rgb},${alpha * 0.4})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
}

window.draw = (t) => {
  const p = (t % LOOP) / LOOP;
  const m = Math.min(W, H), M = Math.max(W, H), portrait = H > W;
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  const bg = g.createLinearGradient(0, 0, W * 0.4, H);
  bg.addColorStop(0, "#020309"); bg.addColorStop(0.5, "#050a1a"); bg.addColorStop(1, "#010207");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // Nebulosas: la textura viaja por un círculo pequeño (periódico) y respira un poco → deriva natural.
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  const drift = (tex, scale, rad, phase, alpha, dir) => {
    const a = TAU * (p * dir + phase);
    // Cubre siempre todo el lienzo (también en vertical) con margen para la deriva: nunca se ve el borde.
    const ar = tex.width / tex.height;
    const th = Math.max(H * 1.3, (W * 1.3) / ar) * (scale / 1.35), tw = th * ar;
    const x = (W - tw) / 2 + Math.cos(a) * M * rad, y = (H - th) / 2 + Math.sin(a) * M * rad * 0.6 - (portrait ? H * 0.08 : 0);
    g.globalAlpha = alpha; g.drawImage(tex, x, y, tw, th);
  };
  g.globalCompositeOperation = "screen";
  drift(nebA, 1.55, 0.035, 0.0, 0.85, 1);
  drift(nebB, 1.35, 0.03, 0.4, 0.28, -1);
  g.globalAlpha = 1;
  // Núcleo luminoso tenue en el corazón de la nebulosa.
  const ox = portrait ? W * 0.45 : W * 0.36, oy = portrait ? H * 0.32 : H * 0.4;
  glow(ox, oy, M * 0.42 * (1 + 0.05 * Math.sin(TAU * p)), "70,90,190", 0.28);
  glow(ox + m * 0.05, oy - m * 0.03, M * 0.16, "230,205,160", 0.07);

  // Estrellas: campo 3D que avanza muy despacio (una pasada de profundidad por bucle) con fundidos.
  const fx = W * 0.5, fy = portrait ? H * 0.42 : H * 0.46, f = m * 0.55;
  for (const s of stars) {
    const z = 1 - ((s.z0 + p * s.laps) % 1);
    const zz = 0.35 + z * 1.4;
    const x = fx + (s.x * f * (portrait ? 0.9 : 1.9)) / zz, y = fy + (s.y * f * (portrait ? 1.9 : 1.1)) / zz;
    if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
    const vis = Math.max(0, Math.min(1, (1 - z) / 0.2, (z - 0.01) / 0.15));
    const tw = 0.7 + 0.3 * Math.sin(TAU * (s.twn * p + s.tw));
    const size = (0.45 + (1 - z) * 0.9) * (m / 720) * (s.big ? 1.9 : 1);
    const warm = s.hue > 0.88, cool = s.hue < 0.2;
    const rgb = warm ? "255,228,180" : cool ? "190,210,255" : "235,240,255";
    if (s.big) { g.globalAlpha = vis * tw * 0.35; glow(x, y, size * 7, rgb, 0.9); g.globalAlpha = 1; }
    g.fillStyle = `rgba(${rgb},${vis * tw})`; g.beginPath(); g.arc(x, y, size, 0, TAU); g.fill();
  }

  // Planeta: textura fractal que gira una vez por bucle (envuelta, sin costura), luz cálida desde arriba-izquierda.
  g.globalCompositeOperation = "source-over";
  const pr = portrait ? W * 0.72 : H * 0.66;
  const px = portrait ? W * 0.86 : W * 0.86, py = portrait ? H * 1.02 : H * 1.08;
  g.globalCompositeOperation = "screen"; glow(px, py, pr * 1.5, "60,100,210", 0.32); g.globalCompositeOperation = "source-over";
  g.save(); g.beginPath(); g.arc(px, py, pr, 0, TAU); g.clip();
  g.fillStyle = "#070c1d"; g.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  const texW = pr * 4, texH = pr * 2, off = p * texW;
  g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.75;
  for (let k = -1; k <= 1; k++) g.drawImage(planetTex, px - pr - off + k * texW, py - pr, texW, texH);
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  // Esfericidad: luz cálida rasante desde arriba-izquierda y noche hacia abajo-derecha.
  const vol = g.createRadialGradient(px - pr * 0.55, py - pr * 0.6, pr * 0.05, px - pr * 0.1, py - pr * 0.1, pr * 1.3);
  vol.addColorStop(0, "rgba(255,226,170,0.10)"); vol.addColorStop(0.3, "rgba(0,0,0,0)"); vol.addColorStop(0.7, "rgba(0,0,0,0.5)"); vol.addColorStop(1, "rgba(0,0,0,0.9)");
  g.fillStyle = vol; g.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  g.restore();
  // Borde atmosférico dorado champagne, suave (no una línea dura).
  g.save(); g.globalCompositeOperation = "screen";
  g.shadowColor = "rgba(236,208,150,0.9)"; g.shadowBlur = pr * 0.06; g.lineCap = "round";
  const rimG = g.createLinearGradient(px - pr, py, px, py - pr);
  rimG.addColorStop(0, "rgba(236,208,150,0)"); rimG.addColorStop(0.45, "rgba(240,215,160,0.85)"); rimG.addColorStop(1, "rgba(236,208,150,0.05)");
  g.strokeStyle = rimG; g.lineWidth = Math.max(1.5, pr * 0.006);
  g.beginPath(); g.arc(px, py, pr, Math.PI * 1.0, Math.PI * 1.7); g.stroke();
  g.shadowBlur = 0;
  g.restore();
  // Anillo fino, apenas sugerido.
  g.save(); g.translate(px, py); g.rotate(-0.28); g.scale(1, 0.16); g.globalCompositeOperation = "screen";
  for (let k = 0; k < 5; k++) {
    g.strokeStyle = `rgba(210,190,150,${0.07 + (k % 2) * 0.04})`; g.lineWidth = pr * 0.018;
    g.beginPath(); g.arc(0, 0, pr * (1.42 + k * 0.05), Math.PI * 1.04, Math.PI * 1.97); g.stroke();
  }
  g.restore();

  // Viñeta cinematográfica.
  g.globalCompositeOperation = "source-over";
  const vg = g.createRadialGradient(W / 2, H * 0.45, m * 0.3, W / 2, H / 2, M * 0.8);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.7)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
};
</script></body></html>
