# OPS BRANCH ONLY — never merge. Explicit one-shot repair of the pinned closed QA output.
name: Free duration repair (root proof required)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "record-original-proof | validate | apply (no provider or row retry)"
        required: true
        default: validate
        type: choice
        options: [validate, record-original-proof, apply, inspect, resume-before-upload]
      root_drive_receipt_sha256:
        description: "Nonsecret hash of root's independent private Drive readback receipt; record only"
        type: string
      private_proof_path:
        description: "Private Storage root proof path returned by record operation"
        type: string
      preservation_proof_sha256:
        description: "Nonsecret exact hash returned by root proof recording"
        type: string
      approved_candidate_sha256:
        description: "Exact candidate hash returned by validate; mandatory for apply"
        type: string
      validation_receipt_path:
        description: "Exact private validation receipt path, mandatory for apply"
        type: string
      validation_receipt_sha256:
        description: "Exact nonsecret hash of the root-reviewed validation receipt"
        type: string
      expected_intent_sha256:
        description: "Exact inspected original intent SHA; resume only"
        type: string
      inspection_receipt_path:
        description: "Exact root-reviewed private inspection receipt path; resume only"
        type: string
      inspection_receipt_sha256:
        description: "Exact root-approved inspection body SHA; resume only"
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: free-duration-repair-41fe8781-75d5-4b48-91b6-0c3094ebedfd
  cancel-in-progress: false
jobs:
  recover:
    if: github.actor == github.repository_owner
    environment: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Offline repair regression tests
        run: node --import tsx --test src/lib/video/long-form/free-duration-repair.test.ts
      - name: Explicit pinned repair operation
        timeout-minutes: 15
        shell: bash
        run: |
          umask 077
          mkdir -p "$REPAIR_ARTIFACT_DIR"
          if node --import tsx scripts/repair-long-form-duration.ts > "$REPAIR_ARTIFACT_DIR/operation.log" 2>&1; then
            echo "Private repair operation completed; inspect private journal metadata."
          else
            echo "Private repair operation stopped; inspect private diagnostic."
            exit 1
          fi
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_INTENT_SHA256: ${{ inputs.expected_intent_sha256 }}
          INSPECTION_RECEIPT_PATH: ${{ inputs.inspection_receipt_path }}
          INSPECTION_RECEIPT_SHA256: ${{ inputs.inspection_receipt_sha256 }}
          VALIDATION_RECEIPT_PATH: ${{ inputs.validation_receipt_path }}
          VALIDATION_RECEIPT_SHA256: ${{ inputs.validation_receipt_sha256 }}
          APPROVED_CANDIDATE_SHA256: ${{ inputs.approved_candidate_sha256 }}
          ROOT_DRIVE_RECEIPT_SHA256: ${{ inputs.root_drive_receipt_sha256 }}
          PRIVATE_PROOF_PATH: ${{ inputs.private_proof_path }}
          PRESERVATION_PROOF_SHA256: ${{ inputs.preservation_proof_sha256 }}
          REPAIR_ARTIFACT_DIR: ${{ runner.temp }}/private-duration-repair
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
# No media/proof/financial artifacts are published. Immutable evidence lives in private Storage.
