name: PI V1 exam - read-only migration audit (no writes)
# Reads the real migration state inside a READ ONLY transaction. Applies nothing.
on:
  push:
    branches: [claude/production-intelligence-v1]
    paths: [scripts/pi-exam/migration-audit.ts]
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/claude/production-intelligence-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/pi-exam/migration-audit.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
