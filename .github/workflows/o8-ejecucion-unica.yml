# O8 — EJECUCIÓN ÚNICA, solo con autorización concreta de Hans: aplica en producción la migración
# supabase/migrations/20261024140000_podcast_v3_studio.sql (sha256 7133f9a4…9d19, idéntica a la propuesta auditada de #207 y
# del candidato #228) con la herramienta del plan, scripts/apply-supabase-migration.ts, un único archivo. El archivo no tiene
# begin/commit propios: la herramienta ejecuta SQL + registro en public._migrations_applied en UNA transacción (no existe la
# ventana «SQL sin registro»). Requiere O3 COMPLETADO (run de O3 leído en la API + `o3.sh done`) y la puerta GATE_NEXT=O8
# 13/13 (tras O7: árbol de producción == árbol de #207). NO ejecuta O9/O10 ni merges, despliegues, flags, secretos,
# conciliación ni llamadas pagadas. Solo con workflow_dispatch desde esta rama y `sha_autorizado` igual al commit ejecutado.
# Una segunda ejecución no escribe: `o8.sh pre` exige 140000 ausente y los cuerpos de 20261005150229.
# Contingencia SOLO si la ejecución dejó algún cambio y la verificación falla: paso 1 guarda (0 filas del estudio) + rollback
# auditado c2ab5b55… en UNA transacción (con filas del estudio se niega y no borra nada); solo si el paso 1 tuvo éxito, paso 2
# docs/ops/o8/O8_contingencia_registro.sql. Dictamen: REVERTIDO | BLOQUEADO. Cancelación o indeterminado:
# docs/ops/o8/RECUPERACION.md (clasificación de solo lectura; no reintentar).
name: o8-ejecucion-unica
on:
  workflow_dispatch:
    inputs:
      sha_autorizado:
        description: "Commit completo autorizado por Hans para esta única ejecución (40 caracteres)"
        required: true
        type: string
      o3_run_id:
        description: "Run de o3-ejecucion-unica.yml que terminó O3 COMPLETADO (evidencia exigida)"
        required: true
        type: string
  # Solo para que GitHub registre el workflow (vive fuera de la rama por defecto): en push el job se OMITE.
  push:
    branches: [claude/o8-ejecucion-unica]
    paths: [".github/workflows/o8-ejecucion-unica.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: o8-ejecucion-unica
  cancel-in-progress: false
jobs:
  o8:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/o8-ejecucion-unica'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      O3: scripts/qa/schema-readonly/o3.sh
      O8: scripts/qa/schema-readonly/o8.sh
      O3_RUN: ${{ inputs.o3_run_id }}
      OUT: ${{ github.workspace }}
      SHA_AUTORIZADO: ${{ inputs.sha_autorizado }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: "0. Vínculo al SHA autorizado (antes de instalar nada)"
        run: bash "$O8" bind "$SHA_AUTORIZADO"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: "1. SHA-256 exactos (migración == propuesta auditada, rollback, contingencia, 20261005150229) e igualdad con #207/#228"
        run: |
          set -euo pipefail
          sha256sum -c docs/ops/o8/SHA256SUMS && sha256sum -c docs/ops/o3/SHA256SUMS && sha256sum -c docs/ops/cierre/SHA256SUMS
          cmp supabase/migrations/20261024140000_podcast_v3_studio.sql supabase/proposals/20261024140000_podcast_v3_studio.sql
          for c in d8b203d665e62602cec5cb72620f03b5630edd12 0acef98aa8da6f510fa0901121a9c34a8bb061ce; do
            git fetch -q --depth=1 origin $c
            git show $c:supabase/proposals/20261024140000_podcast_v3_studio.sql | cmp - supabase/migrations/20261024140000_podcast_v3_studio.sql
            git show $c:supabase/proposals/20261024140000_podcast_v3_studio.rollback.sql | cmp - supabase/proposals/20261024140000_podcast_v3_studio.rollback.sql
          done
          echo "OK: migración y rollback idénticos a los de #207 (d8b203d) y del candidato #228 (0acef98)"
      - name: Pruebas offline de la puerta, del reconciliador y del arnés
        run: python3 -I scripts/qa/schema-readonly/gate_test.py && python3 -I scripts/qa/schema-readonly/reconcile_test.py && bash scripts/qa/schema-readonly/harness-lib_test.sh && bash scripts/qa/schema-readonly/o8-postgate_test.sh && bash -n "$O8"
      - name: PostgreSQL 17 (solo cliente)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -yq postgresql-17
          sudo systemctl stop postgresql || true
      - name: Conexión (enmascarada)
        run: |
          set -euo pipefail
          URL=$(npx tsx -e 'import { resolveConnection } from "./scripts/lib/supabase-db"; const c = resolveConnection(); if (!c) { process.exit(3) } process.stdout.write(c.connectionString)')
          echo "::add-mask::$URL"; PW=$(node -e 'const u=new URL(process.argv[1]); process.stdout.write(decodeURIComponent(u.password))' "$URL"); echo "::add-mask::$PW"
          echo "DB_URL=$URL" >> "$GITHUB_ENV"
      - name: "2. O3 COMPLETADO: run de O3 en la API y o3.sh done sobre lectura nueva; puerta O8 13/13"
        env: { OUT: "${{ github.workspace }}/cierre-pre", GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          set +e -o pipefail
          bash "$O8" o3run "$O3_RUN" || { echo "::error::sin evidencia vinculada de O3 COMPLETADO: no se ejecuta O8"; exit 1; }
          bash "$O3" snap "$DB_URL" o3now.snap && bash "$O3" done o3now.snap || { echo "::error::O3 no está en su estado auditado: no se ejecuta O8"; exit 1; }
          GATE_ONLY=1 GATE_NEXT=O8 bash scripts/qa/schema-readonly/cierre.sh 2>&1 | tee puerta-o8.log; rc=${PIPESTATUS[0]}
          n=$(grep -c '^PASS GATE\[O8\]' puerta-o8.log); f=$(grep -c '^FAIL' puerta-o8.log)
          echo "puerta O8: rc=$rc PASS=$n FAIL=$f"
          [ "$rc" -eq 0 ] && [ "$n" -eq 13 ] && [ "$f" -eq 0 ] && grep -q '^RESULT cierre: 0 FAIL' puerta-o8.log || { echo "::error::puerta O8 no está 13/13 en verde: no se ejecuta O8"; exit 1; }
      - name: "3. Estado previo (solo lectura) contra referencias auditadas: 130000 sí / 140000 no, t t t f, cuerpos 20261005150229, 0 en curso, statement_timeout 2 min"
        run: |
          set -euo pipefail
          bash "$O8" snap "$DB_URL" pre.snap
          bash "$O8" pre pre.snap
          bash "$O8" classify pre.snap | grep -q 'O8 STATE: PRE'
          bash "$O8" probe
      - name: "4. Ejecutar O8 (herramienta real, un solo archivo; SQL + registro en una transacción)"
        id: exec
        run: bash "$O8" apply
      - name: "5. Verificación posterior: done (referencias auditadas, acceso por rol, libro vacío) + sin otros cambios + GATE_NEXT=O10 14/14 (cola informativa)"
        id: verify
        env: { OUT: "${{ github.workspace }}/cierre-post" }
        run: |
          set +e -uo pipefail
          ok=1
          bash "$O8" snap "$DB_URL" post.snap || ok=0
          bash "$O8" post pre.snap post.snap || ok=0
          # after O8 the next operation is O10 (merge #228): o8-postgate.sh requires its 14 database/repository checks; the
          # in-flight one belongs to O10 and is only reported (a busy podcast is not an O8 failure). Tested offline.
          g=0; GATE_ONLY=1 GATE_NEXT=O10 bash scripts/qa/schema-readonly/cierre.sh > puerta-o10.log 2>&1 || g=$?
          grep -E '^(PASS|FAIL) GATE|^RESULT' puerta-o10.log
          bash scripts/qa/schema-readonly/o8-postgate.sh puerta-o10.log "$g" || ok=0
          if [ $ok = 1 ]; then
            echo "VERIFICACION POSTERIOR: OK"
            echo "O8 COMPLETADO · commit $SHA_AUTORIZADO · run ${{ github.run_id }} · verificación posterior y GATE_NEXT=O10 (14 comprobaciones de base de datos y repositorio) en verde" >> "$GITHUB_STEP_SUMMARY"
          else echo "::error::verificación posterior fallida"; exit 1; fi
      - name: "6. Contingencia (solo si la ejecución dejó cambios y la verificación falla; guarda de filas del estudio; se corta si falla el paso 1)"
        if: failure() && (steps.exec.outcome == 'success' || steps.exec.outcome == 'failure') && steps.verify.outcome != 'success'
        run: |
          set +e -uo pipefail
          bash "$O8" snap "$DB_URL" now.snap || { echo "::error::no se pudo leer el estado: NO se aplica nada. INDETERMINADO: seguir docs/ops/o8/RECUPERACION.md"; exit 1; }
          bash "$O8" classify now.snap
          if bash "$O8" same pre.snap now.snap > same0.log; then
            echo "::error::O8 no dejó ningún cambio (estado previo exacto): nada que revertir. BLOQUEADO"; exit 1; fi
          grep FAIL same0.log
          has=$(grep '^ma_has_o8|' now.snap | cut -d'|' -f2); m=$(grep '^m140|' now.snap | cut -d'|' -f2)
          echo "precondición contingencia: 140000 registrada=$has marcador=$m (se exige al menos uno de los dos)"
          [ "$has" = 1 ] || [ "$m" = t ] || { echo "::error::el cambio no es de O8: NO se aplica la contingencia. BLOQUEADO"; exit 1; }
          bash "$O8" contingency "$DB_URL" || { echo "::error::contingencia detenida (si falló el paso 1, el paso 2 no se ejecutó). INDETERMINADO: seguir docs/ops/o8/RECUPERACION.md"; bash "$O8" snap "$DB_URL" fail.snap && bash "$O8" classify fail.snap; exit 1; }
          bash "$O8" snap "$DB_URL" after.snap || { echo "::error::no se pudo leer el estado tras la contingencia. INDETERMINADO"; exit 1; }
          bash "$O8" verdict pre.snap after.snap; v=$?
          g=0; GATE_ONLY=1 OUT="$PWD/cierre-rb" GATE_NEXT=O8 bash scripts/qa/schema-readonly/cierre.sh > puerta-o8-rb.log 2>&1 || g=$?
          grep -E '^(PASS|FAIL) GATE|^RESULT' puerta-o8-rb.log
          case "$v" in
            0) [ "$g" -eq 0 ] && echo "::error::O8 REVERTIDO (estado previo exacto, puerta O8 en verde)" || echo "::error::O8 revertido pero la puerta O8 no pasa: BLOQUEADO";;
            3) echo "::error::O8 deshecho; cambios concurrentes de datos NO sobrescritos: BLOQUEADO";;
            *) echo "::error::la contingencia no dejó el estado previo: INDETERMINADO, seguir docs/ops/o8/RECUPERACION.md";;
          esac
          exit 1
      - name: "Cancelación: clasificación de solo lectura (no escribe)"
        if: cancelled() && env.DB_URL != ''
        run: |
          bash "$O8" snap "$DB_URL" cancel.snap && bash "$O8" classify cancel.snap || true
          echo "::error::run cancelado: NO reintentar; seguir docs/ops/o8/RECUPERACION.md"
