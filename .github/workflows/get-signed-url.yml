name: Exportar video existente (solo lectura)

# Descarga el `final.mp4` de una solicitud YA renderizada y lo publica
# como artifact del workflow, sin generar ni renderizar nada nuevo. No
# llama a Claude, ElevenLabs, Pexels ni Remotion, y no toca la cuota de
# ningún usuario — únicamente lee un objeto que ya existe en el bucket
# privado "videos" (ver scripts/export-final-video.ts).
#
# No usa createSignedUrl(): imprimir esa URL en el log de Actions hace
# que GitHub enmascare el token como "***" (el runner también enmascara
# los segmentos internos de cualquier JWT que coincida con los de un
# secret registrado, y no se puede confirmar si eso era una colisión de
# formato o una coincidencia real con SUPABASE_SERVICE_ROLE_KEY) — se
# descargan los bytes del archivo directamente en su lugar.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID de la solicitud (video_requests.id) cuyo final.mp4 ya existe"
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar video existente
        run: npx tsx scripts/export-final-video.ts
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Calcular estadísticas del guion ya generado
        run: npx tsx scripts/export-script-stats.ts
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publicar video como artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ inputs.request_id }}
          path: final-${{ inputs.request_id }}.mp4
          retention-days: 1
