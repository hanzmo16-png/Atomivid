name: URL firmada de descarga (solo lectura)

# Genera y verifica una URL firmada temporal para el `final.mp4` de una
# solicitud YA renderizada, sin generar ni renderizar nada nuevo. No llama
# a Claude, ElevenLabs, Pexels ni Remotion, y no toca la cuota de ningún
# usuario — únicamente pide a Supabase Storage una URL de lectura temporal
# para un objeto que ya existe en el bucket privado "videos" (ver
# scripts/get-signed-url.ts).
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID de la solicitud (video_requests.id) cuyo final.mp4 ya existe"
        required: true
        type: string
      expires_in_seconds:
        description: "Vigencia de la URL firmada, en segundos"
        required: false
        type: string
        default: "7200"

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar y verificar URL firmada
        run: npx tsx scripts/get-signed-url.ts
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          EXPIRES_IN_SECONDS: ${{ inputs.expires_in_seconds }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
