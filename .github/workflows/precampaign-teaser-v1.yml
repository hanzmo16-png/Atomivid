name: ATOMIVID precampaign teaser V1
# The run title carries the VFX dispatch key so the server can reconcile a dispatch with its run.
run-name: ${{ inputs.stage == 'vfx-director-execute' && format('vfx-execute {0}', inputs.v2_args) || 'ATOMIVID precampaign teaser V1' }}

# Producción controlada de marketing — SOLO ejecución manual. Esta versión solo hace el
# descubrimiento de solo lectura (scripts/precampaign-teaser/discover.ts): comprueba los dos
# clips reales de Hans subidos al bucket privado "videos", el avatar y la voz indicados por id
# y los assets a reutilizar. No recibe ninguna clave de proveedor pagado: gasto USD 0.00.
# stage=produce + confirm=PRODUCIR (autorizado, tope absoluto USD 1.03) ejecuta
# scripts/precampaign-teaser/produce.ts: voz clonada existente (ElevenLabs) y avatar existente
# (HeyGen) por el gate de pago + ledger; montaje y retoque locales con ffmpeg. No publica nada.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "discover (sin gasto), heygen-preflight (GET gratuito de la clave HeyGen) o produce (gasto autorizado, tope USD 1.03)"
        required: true
        type: choice
        options: [discover, heygen-preflight, produce, v2-analyze, v2-looktest, v2-vfx, v2-vfx002, v2-scout, v2-master, vfx-director-execute, vfx-director-inspect]
        default: discover
      confirm:
        description: "Escribir PRODUCIR para habilitar las claves pagadas en stage=produce"
        required: false
        type: string
      v2_args:
        description: "V2: parámetros JSON (p. ej. ventana VFX {\"vfxStart\":1.2}); opcional"
        required: false
        type: string
      avatar_mode:
        description: "heygen (master) o review-placeholder (corte SOLO de revisión, sin llamada a HeyGen)"
        required: false
        type: choice
        options: [heygen, review-placeholder]
        default: heygen
      opening_path:
        description: "Ruta en el bucket 'videos' del clip HANS_OPENING_REAL (1080x1920, 30 fps)"
        required: false
        type: string
      closing_path:
        description: "Ruta en el bucket 'videos' del clip HANS_CLOSING_REAL (1080x1920, 30 fps)"
        required: false
        type: string
      avatar_id:
        description: "avatars.id autorizado de Hans (opcional)"
        required: false
        type: string
      voice_id:
        description: "user_voices.id de la voz clonada autorizada de Hans (opcional)"
        required: false
        type: string
      reuse_paths:
        description: "Rutas en 'videos' de assets ya renderizados a reutilizar, separadas por comas (opcional)"
        required: false
        type: string
      reuse_prefixes:
        description: "Prefijos en 'videos' a listar (renders ya entregados), separados por comas (opcional)"
        required: false
        type: string
      probe_prefix:
        description: "Prefijo en 'videos' con los clips del operador: ffprobe + fotogramas de referencia (opcional)"
        required: false
        type: string
      avatar_photo_ids:
        description: "avatars.id cuya foto de origen guardada se exporta para revisión visual (opcional)"
        required: false
        type: string
      find_name:
        description: "Texto a buscar en la raíz de todos los buckets (localizar subidas del operador; opcional)"
        required: false
        type: string
      list_identities:
        description: "Listar avatares y voces listos (id, nombre, proveedor; sin usuarios) para elegir los de Hans"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # VFX execution has its own queue: a teaser stage must never cancel a pending VFX dispatch.
  group: ${{ startsWith(inputs.stage, 'vfx-director-') && format('atomivid-{0}', inputs.stage) || 'atomivid-precampaign-teaser-v1' }}
  cancel-in-progress: false

jobs:
  discover:
    if: inputs.stage == 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descubrimiento sin gasto (solo Supabase, solo lectura)
        run: npx tsx scripts/precampaign-teaser/discover.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEASER_OPENING_PATH: ${{ inputs.opening_path }}
          TEASER_CLOSING_PATH: ${{ inputs.closing_path }}
          TEASER_AVATAR_ID: ${{ inputs.avatar_id }}
          TEASER_VOICE_ID: ${{ inputs.voice_id }}
          TEASER_REUSE_PATHS: ${{ inputs.reuse_paths }}
          TEASER_REUSE_PREFIXES: ${{ inputs.reuse_prefixes }}
          TEASER_LIST_IDENTITIES: ${{ inputs.list_identities }}
          TEASER_PROBE_PREFIX: ${{ inputs.probe_prefix }}
          TEASER_AVATAR_PHOTO_IDS: ${{ inputs.avatar_photo_ids }}
          TEASER_FIND_NAME: ${{ inputs.find_name }}

      - name: Publicar informe de descubrimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precampaign-teaser-v1-discovery
          path: teaser-discovery/
          if-no-files-found: ignore
          retention-days: 3

  produce:
    if: (inputs.stage == 'produce' && inputs.confirm == 'PRODUCIR') || inputs.stage == 'heygen-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: Producir teaser (gate de pago + ledger, tope USD 1.03)
        run: npx tsx scripts/precampaign-teaser/produce.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ inputs.stage == 'produce' && secrets.ELEVENLABS_API_KEY || '' }}
          TEASER_PREFLIGHT_ONLY: ${{ inputs.stage == 'heygen-preflight' && '1' || '0' }}
          HEYGEN_API_KEY: ${{ inputs.avatar_mode != 'review-placeholder' && secrets.HEYGEN_API_KEY || '' }}
          TEASER_HARD_CAP_USD: "1.03"
          TEASER_AVATAR_MODE: ${{ inputs.avatar_mode }}
          TEASER_OPENING_PATH: ${{ inputs.opening_path }}
          TEASER_CLOSING_PATH: ${{ inputs.closing_path }}
          TEASER_AVATAR_ID: ${{ inputs.avatar_id }}
          TEASER_VOICE_ID: ${{ inputs.voice_id }}

      - name: Publicar master, preview e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precampaign-teaser-v1-output
          path: |
            teaser-output/*.mp4
            teaser-output/*.jpg
            teaser-output/*.json
            teaser-output/heygen-preflight.json
            teaser-output/work/captions.ass
          if-no-files-found: ignore
          retention-days: 7

  # V2 CINEMATIC: análisis (gratis), VFX-001 (único gasto permitido: Luma, tope por plan) y master.
  # Nunca recibe claves de ElevenLabs ni HeyGen: TTS y avatar solo se reutilizan desde el ledger.
  v2:
    if: startsWith(inputs.stage, 'v2-') && inputs.confirm == 'PRODUCIR'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1

      - name: Transcripción y beats locales (faster-whisper + numpy, sin API)
        if: inputs.stage != 'v2-vfx' && inputs.stage != 'v2-vfx002' && inputs.stage != 'v2-scout'
        run: python3 -m pip install --quiet "faster-whisper==1.1.1" numpy

      # VFX-002: matte local (Robust Video Matting, ONNX en CPU) + composición local. Sin proveedor, USD 0.
      - name: Matting y composición locales (onnxruntime + OpenCV, sin API)
        if: inputs.stage == 'v2-vfx002'
        run: |
          python3 -m pip install --quiet "onnxruntime==1.30.0" "opencv-contrib-python-headless==5.0.0.93" "numpy==2.4.6"
          mkdir -p teaser-v2
          curl -fsSL -o teaser-v2/rvm_mobilenetv3_fp32.onnx https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx
          echo "88d4531297118f595bf2fd60f6f566aec2e559393802d1f436c380f0cbbd2828  teaser-v2/rvm_mobilenetv3_fp32.onnx" | sha256sum -c -

      # Scout (USD 0): Pexels Videos (catálogo gratuito) + capturas públicas de la app en producción.
      - name: Herramientas de scouting (OpenCV + Playwright, sin API de pago)
        if: inputs.stage == 'v2-scout'
        run: |
          python3 -m pip install --quiet "opencv-contrib-python-headless==5.0.0.93" "numpy==2.4.6"
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Ejecutar etapa V2
        run: npx tsx scripts/precampaign-teaser/${{ inputs.stage }}.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LUMA_API_KEY: ${{ inputs.stage == 'v2-vfx' && secrets.LUMA_API_KEY || '' }}
          PEXELS_API_KEY: ${{ (inputs.stage == 'v2-scout' || inputs.stage == 'v2-vfx002') && secrets.PEXELS_API_KEY || '' }}
          TEASER_V2_ARGS: ${{ inputs.v2_args }}
          SCOUT_PLATES: ${{ inputs.stage == 'v2-scout' && inputs.reuse_paths || '' }}

      - name: Publicar resultados V2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precampaign-v2-${{ inputs.stage }}
          path: |
            teaser-v2/analysis/
            teaser-v2/vfx/*.json
            teaser-v2/vfx/*.jpg
            teaser-v2/vfx/*.mp4
            teaser-v2/vfx002/*.json
            teaser-v2/vfx002/*.jpg
            teaser-v2/vfx002/*.png
            teaser-v2/vfx002/*.mp4
            teaser-v2/scout/*.json
            teaser-v2/scout/nyc/*.jpg
            teaser-v2/scout/ui/
            teaser-v2/scout/plates.json
            teaser-v2/scout/plates/*[0-9].mp4
            teaser-v2/output/
          if-no-files-found: ignore
          retention-days: 7

  # VFX Director: page-initiated durable execution. Registered on the default branch through this file
  # name; the dispatched ref (the deployed preview branch) supplies this job. The only input is the
  # dispatch key written ledger-first by the owner-authenticated API; executors, material locations and
  # capabilities come from execution-profiles.ts at this exact commit. No paid provider key is passed.
  vfx-director:
    if: startsWith(inputs.stage, 'vfx-director-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar compositor local
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Ejecutar una tarea durable (o inspeccionar sin escrituras)
        run: npx tsx scripts/vfx/execution-runner.ts
        env:
          VFX_DIRECTOR_ENABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VFX_DISPATCH_KEY: ${{ inputs.stage == 'vfx-director-execute' && inputs.v2_args || '' }}
          VFX_INSPECT_JOB: ${{ inputs.stage == 'vfx-director-inspect' && inputs.v2_args || '' }}
