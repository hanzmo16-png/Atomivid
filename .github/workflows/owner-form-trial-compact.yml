name: Complete owner form trial with bounded visual responses
on:
  push:
    branches: [codex/vfx-sequence-compositor]
    paths: [scripts/owner-form-trial-resume.ts, .github/workflows/owner-form-trial-compact.yml]
permissions:
  contents: read
concurrency:
  group: owner-form-trial-34bc43f3-a53d-4daa-b8fa-bef3f1544b04
  cancel-in-progress: false
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: node --import tsx --test src/lib/video/script-quality.test.ts src/lib/billing/owner-form-trial.test.ts src/lib/video/visual-flow.test.ts src/lib/paid-calls/owner-form-recovery.test.ts src/lib/video/visual-review.test.ts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --import tsx scripts/owner-form-trial-resume.ts
        timeout-minutes: 25
        env:
          ATOMIVID_RUNTIME: production
          OWNER_FORM_TRIAL_WORKER: 'true'
          OWNER_FORM_RECOVERY_WORKER: 'true'
          OWNER_FORM_RECOVERY_STAGE: compact-final
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: uYlzyj2kIZo3HfBB21vF
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
          VOICE_PROVIDER: elevenlabs
          FOOTAGE_PROVIDER: pexels
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MUSIC_PROVIDER: curated-library
          MUSIC_TRACK_URLS: ${{ secrets.MUSIC_TRACK_URLS }}
          PRICING_ELEVENLABS_USD_PER_1K_CHARS: '0.1'
          OPENAI_IMAGE_ESTIMATED_COST_USD: '0.08'
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_SIZE: 1024x1536
          OPENAI_IMAGE_QUALITY: medium
          OPENAI_IMAGE_MAX_RETRIES: '0'
          OPENAI_IMAGE_TIMEOUT_MS: '120000'
      - name: Audit real delivery
        run: node --import tsx scripts/owner-form-trial-audit.ts
        env:
          REQUEST_ID: 34bc43f3-a53d-4daa-b8fa-bef3f1544b04
          OWNER_FORM_TRIAL_WORKER: 'true'
          OWNER_FORM_RECOVERY_WORKER: 'true'
          OWNER_FORM_RECOVERY_STAGE: compact-final
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Close a claimed timed-out attempt
        if: failure()
        run: node --import tsx scripts/mark-render-failed.ts
        env:
          REQUEST_ID: 34bc43f3-a53d-4daa-b8fa-bef3f1544b04
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-form-trial-34bc43f3-a53d-4daa-b8fa-bef3f1544b04-${{ github.run_id }}
          path: owner-form-trial-output/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
