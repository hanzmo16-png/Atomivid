# USD 0 · PRODUCCIÓN SOLO SE LEE. Ensayo de O1 en PostgreSQL 17 desechable: copia de solo lectura del estado previo,
# ejecución del SQL auditado A, puerta O2 COMPLETA sobre el estado posterior simulado, idempotencia, estados
# inesperados y rollback. Toda escritura va a la réplica local (socket unix); nada se sube y las copias se borran.
name: o1-ensayo-replica
on:
  push:
    branches: [claude/o1-ensayo-replica]
    paths: [".github/workflows/o1-ensayo-replica.yml", "scripts/qa/schema-readonly/o1-replica.sh"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: o1-ensayo-replica
  cancel-in-progress: false
jobs:
  ensayo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Pruebas offline (puerta y reconciliador)
        run: python3 -I scripts/qa/schema-readonly/gate_test.py && python3 -I scripts/qa/schema-readonly/reconcile_test.py
      - name: PostgreSQL 17
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -yq postgresql-17
          sudo systemctl stop postgresql || true
      - name: Ensayo O1 en réplica desechable (escrituras solo locales)
        run: bash scripts/qa/schema-readonly/o1-replica.sh
