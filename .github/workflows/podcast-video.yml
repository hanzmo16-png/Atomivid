name: Podcast video (in-app production)
# Dispatched by the app (POST /api/podcast/[id]/video or a long narration) with ONLY the episode id and the job
# kind. Narration goes through the same gated, resumable code as the web route (paid chunks are never paid twice);
# the video is rendered by the editor v3 engine on this runner and stored in the private "videos" bucket.
# The external editor exchange (bucket podcast-editor, Grok's account) is not used here.
# Supervised pilot: a scheduled tick starts productions whose ONE-SHOT start time has come (set by the owner in the
# app with a budget); it never creates productions by itself. Notices (delivery / block / budget) are one comment per
# run on the repository's notices issue, mentioning the owner.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  repository_dispatch:
    types: [podcast-video]
  workflow_dispatch:
    inputs:
      episode_id:
        description: "podcast_episodes.id"
        required: true
      kind:
        description: "video | narration"
        required: true
        default: video
permissions:
  contents: read
  # Owner notices: a comment on the notices issue (no other write).
  issues: write
concurrency:
  # Notices never wait behind a long production of the same episode.
  group: podcast-${{ (github.event.client_payload.kind == 'notices' && 'notices') || github.event.client_payload.episodeId || inputs.episode_id || 'scheduler' }}
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    # Up to ~1 h may be a Pexels rate-limit wait on a 30-minute episode (~120 scenes); the run stays alive.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Anything scheduled is due?
        id: due
        # Cheap check before installing anything: only a scheduled tick with a due production goes on.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          N="$(curl -sf "$SUPABASE_URL/rest/v1/podcast_episodes?select=id&video_status=eq.scheduled&scheduled_at=lte.$NOW&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | grep -o '"id"' | wc -l || echo 0)"
          echo "go=$([ "$N" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/setup-node@v4
        if: steps.due.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.due.outputs.go == 'true'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
        if: steps.due.outputs.go == 'true' && github.event.client_payload.kind != 'notices'
      - name: Produce
        if: steps.due.outputs.go == 'true'
        timeout-minutes: 185
        run: npx tsx scripts/podcast-video-worker.ts
        env:
          ATOMIVID_RUNTIME: production
          EPISODE_ID: ${{ github.event.client_payload.episodeId || inputs.episode_id }}
          JOB_KIND: ${{ (github.event_name == 'schedule' && 'scheduler') || github.event.client_payload.kind || inputs.kind }}
          PODCAST_TOKEN_FILE: ${{ runner.temp }}/podcast-run-token
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_MENTION: ${{ github.repository_owner }}
          FFMPEG_BIN: ffmpeg
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Podcast 2.x: must match the app's PODCAST_V2_ENABLED (repository variable), or the worker would not read the
          # per-turn production. The server also refuses to narrate a v2 row as v1 (fail-closed) if they ever diverge.
          PODCAST_V2_ENABLED: ${{ vars.PODCAST_V2_ENABLED }}
          # Podcast 3.0 (estudio): debe coincidir con PODCAST_V3_ENABLED de la app (variable del repositorio). Sin ella el
          # worker no genera y marca el episodio «failed» sin cargos. HeyGen solo se usa en modos con avatar.
          PODCAST_V3_ENABLED: ${{ vars.PODCAST_V3_ENABLED }}
          # Piloto del dueño (mismo criterio que la app): solo los episodios de esta cuenta se generan con el interruptor apagado.
          PODCAST_V3_OWNER_USER_ID: ${{ secrets.INTERNAL_PRODUCTION_OWNER_USER_ID }}
          # Sin el secreto (no existe en Actions), el generador pregunta a la app, con una petición firmada, si el dueño del
          # episodio es el dueño (la app sí lo conoce). Nada de la identidad del dueño queda en el repositorio.
          # Interruptor del piloto también en el generador (variable del repositorio PODCAST_V3_OWNER_PILOT=0 lo apaga aquí).
          PODCAST_V3_OWNER_PILOT: ${{ vars.PODCAST_V3_OWNER_PILOT }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          # Recreaciones Recraft del estudio: apagadas salvo PODCAST_STUDIO_RECRAFT=1 (variable del repositorio, igual que en
          # la app). FAL_ADMIN_KEY solo lee saldo/uso (gratis) para la verificación previa, como render.yml.
          PODCAST_STUDIO_RECRAFT: ${{ vars.PODCAST_STUDIO_RECRAFT }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_ADMIN_KEY: ${{ secrets.FAL_ADMIN_KEY }}
          # Same allocation rate as the production app and the render worker.
          PRICING_ELEVENLABS_USD_PER_1K_CHARS: '0.2'
      - name: Mark failed if the step died
        if: (failure() || cancelled()) && steps.due.outputs.go == 'true' && github.event.client_payload.kind != 'notices'
        run: npx tsx scripts/podcast-video-mark-failed.ts
        env:
          EPISODE_ID: ${{ github.event.client_payload.episodeId || inputs.episode_id }}
          JOB_KIND: ${{ github.event.client_payload.kind || inputs.kind }}
          PODCAST_TOKEN_FILE: ${{ runner.temp }}/podcast-run-token
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_MENTION: ${{ github.repository_owner }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
