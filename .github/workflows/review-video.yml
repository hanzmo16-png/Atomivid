name: Video review and synthetic editor validation
# Review modes measure existing media without paid provider calls. The explicit podcast-editor-publish
# mode uploads only the committed synthetic fixture through its assigned editor session. Two jobs: "measure" has the database secret but a read-only token and
# encrypts everything private (frames, script, numbers tied to the owner) to the operator session key;
# "publish" has NO secrets and only commits those encrypted files to the ops-sealed-out branch.
on:
  push:
    branches: [claude/video-review]
    paths: [ops/review-video.mode]
permissions:
  contents: read
concurrency:
  group: review-video
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick > /dev/null
      - name: Browser for the app check
        run: |
          if [ "$(head -1 ops/review-video.mode | tr -d '[:space:]')" = "podcast-editor-app" ]; then npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium; fi
      - name: Run selected review or synthetic publication
        run: |
          MODE="$(head -1 ops/review-video.mode | tr -d '[:space:]')"
          if [ "$MODE" = "owner-identity" ]; then npx tsx scripts/review/owner-identity.ts;
          elif [ "$MODE" = "podcast-editor-publish" ]; then
            git fetch --depth=1 origin d4a9b2ee384cb971dc535614a8b0964487d0de99
            git archive d4a9b2ee384cb971dc535614a8b0964487d0de99 scripts/podcast-editor-v3 src/lib/podcast/editor/fixtures/editor-v3 | tar -x
            npx tsx scripts/review/publish-editor-fixture.ts;
          elif [ "$MODE" = "podcast-editor-live" ]; then npx tsx scripts/review/podcast-editor-live.ts;
          elif [ "$MODE" = "podcast-editor-app" ]; then
            # Line 2: target=<https URL>; line 3: owner_session=yes only when the owner sign-in is authorised.
            export E2E_BYPASS_MODE="$(sed -n 's/^bypass_mode=//p' ops/review-video.mode | head -1)"
            export E2E_APP="$(sed -n 's/^target=//p' ops/review-video.mode | head -1)"
            grep -q '^owner_session=yes$' ops/review-video.mode && export OWNER_SESSION_AUTHORIZED=yes
            npx tsx scripts/review/podcast-editor-app-e2e.ts;
          else npx tsx scripts/review/review-video.ts "$MODE"; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INTERNAL_PRODUCTION_OWNER_USER_ID: ${{ secrets.INTERNAL_PRODUCTION_OWNER_USER_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Hand over encrypted outputs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-review
          path: sealed-out/*.sealed
          if-no-files-found: ignore
          retention-days: 3
  publish:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sealed-review
          path: sealed-out
      - name: Commit encrypted files to ops-sealed-out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls sealed-out/*.sealed >/dev/null 2>&1 || { echo "nothing sealed"; exit 0; }
          for f in sealed-out/*; do case "$f" in *.sealed) ;; *) echo "refusing non-sealed file"; exit 1;; esac; done
          git init -q so && cd so
          git config user.name "atomivid-ops" && git config user.email "ops@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ops-sealed-out; then git checkout -q -B ops-sealed-out FETCH_HEAD; else git checkout -q --orphan ops-sealed-out; fi
          mkdir -p "review-$GITHUB_RUN_ID" && cp ../sealed-out/*.sealed "review-$GITHUB_RUN_ID/"
          git add -A && git commit -qm "sealed review outputs of run $GITHUB_RUN_ID" && git push -q origin ops-sealed-out
