# Validación REAL desde la cuenta del dueño (cierre 2026-10-27, autorizado por Hans; tope total USD 16: Podcast ≤ 4,
# Long Form ≤ 12). Cada caso tiene su tope fijo aquí; el presupuesto es la autorización por producción que la base de datos
# hace cumplir. «preflight» no autoriza ni cobra nada. El registro público solo muestra hechos no sensibles; capturas y
# archivos descargados se cifran (clave pública scripts/qa/real/evidence.pub.pem) antes de guardarse en la rama de evidencias.
name: prueba-real
on:
  workflow_dispatch:
    inputs:
      caso:
        description: "preflight (USD 0) | descargas (USD 0, MP4+MP3 de episodio_reintento) | p1 (≤ 1) | p2 (≤ 3) | lf (≤ 12, todo el caso) | lf-inspeccion (USD 0, video terminado de lf_request_id) | pod-diag / pod-clips (USD 0, episodio de estudio pod_episode_id) | pod-assets (≤ 1, recursos de estudio con Recraft)"
        required: true
        type: choice
        options: [preflight, descargas, p1, p2, lf, lf-inspeccion, pod-diag, pod-clips, pod-assets, pod-catalog, pod-fragment, pod-scan, pod-ui, pod-remaster, pod-calib]
      presupuesto_usd:
        description: "Autorización por episodio (no supera el tope del caso)"
        required: true
        default: "0"
      episodio_reintento:
        description: "Podcast: id de un episodio FALLIDO del dueño para reintentarlo por la interfaz (reutiliza lo pagado)"
        required: false
        default: ""
      lf_prior_usd:
        description: "Long Form: lo ya gastado en intentos anteriores del caso (cuenta para el tope de 12)"
        required: false
        default: "0"
      lf_topic:
        description: "Long Form: tema (vacío = el predeterminado)"
        required: false
        default: ""
      lf_request_id:
        description: "Long Form: retomar una solicitud ya creada (no crear otra ni volver a pagar el guion)"
        required: false
        default: ""
      pod_episode_id:
        description: "Podcast estudio: episodio a diagnosticar (solo lectura)"
        required: false
        default: ""
  # Solo registra el workflow (vive fuera de la rama por defecto): en push el job se OMITE.
  push:
    branches: [claude/puertas-merge]
    paths: [".github/workflows/prueba-real.yml"]
permissions:
  contents: write
concurrency:
  group: prueba-real-${{ inputs.caso == 'lf' && 'lf' || 'podcast' }}
  cancel-in-progress: false
jobs:
  real:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CASO: ${{ inputs.caso }}
      PW_CHANNEL: chrome
      BUDGET_USD: ${{ inputs.presupuesto_usd }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Tope del caso (antes de instalar nada)
        run: |
          case "$CASO" in preflight|descargas|lf-inspeccion|pod-diag|pod-clips|pod-catalog|pod-scan|pod-ui|pod-remaster|pod-calib) MAX=0;; pod-assets) MAX=1;; pod-fragment) MAX=0.2;; p1) MAX=1;; p2) MAX=3;; lf) MAX=12;; *) echo "::error::caso desconocido"; exit 1;; esac
          python3 -c "import sys; b=float(sys.argv[1]); m=float(sys.argv[2]); sys.exit(0 if 0 <= b <= m and (m == 0 or b > 0) else 1)" "$BUDGET_USD" "$MAX" \
            || { echo "::error::presupuesto $BUDGET_USD fuera del tope del caso $CASO (USD $MAX)"; exit 1; }
          echo "caso=$CASO presupuesto=USD $BUDGET_USD (tope del caso USD $MAX)"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: "Navegador y ffmpeg (sin apt; Chrome del runner, ffmpeg/ffprobe de node_modules como render.yml)"
        timeout-minutes: 10
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.55.0 >/dev/null
          chmod +x node_modules/@ffprobe-installer/linux-x64/ffprobe 2>/dev/null || true
          echo "$PWD/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"; echo "$PWD/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
          google-chrome --version
      - name: Sesiones de la cuenta del dueño (sin correo; nada sensible en el registro)
        run: |
          node scripts/qa/real/session.mjs "$RUNNER_TEMP/state1.json"
          node scripts/qa/real/session.mjs "$RUNNER_TEMP/state2.json"
      - name: Prueba real (Podcast Studio o Long Form)
        env:
          STATE_FILE: ${{ runner.temp }}/state1.json
          STATE_FILE_2: ${{ runner.temp }}/state2.json
          EVID: ${{ runner.temp }}/evid/shots
          LF_REQUEST_ID: ${{ inputs.lf_request_id }}
          LF_PRIOR_USD: ${{ inputs.lf_prior_usd }}
          RETRY_EPISODE_ID: ${{ inputs.episodio_reintento }}
          LF_TOPIC: ${{ inputs.lf_topic }}
          GH_TOKEN: ${{ github.token }}
          POD_EPISODE_ID: ${{ inputs.pod_episode_id }}
          ELEVENLABS_API_KEY: ${{ inputs.caso == 'pod-diag' && secrets.ELEVENLABS_API_KEY || '' }}
          FAL_KEY: ${{ (inputs.caso == 'pod-assets' || inputs.caso == 'pod-fragment') && secrets.FAL_KEY || '' }}
        run: |
          if [ "$CASO" = pod-diag ]; then node scripts/qa/real/pod-diag.mjs; exit $?; fi
          if [ "$CASO" = pod-ui ]; then node scripts/qa/real/pod-ui.mjs; exit $?; fi
          if [ "$CASO" = pod-clips ]; then node scripts/qa/real/pod-clips.mjs; exit $?; fi
          if [ "$CASO" = pod-fragment ] || [ "$CASO" = pod-scan ] || [ "$CASO" = pod-remaster ] || [ "$CASO" = pod-calib ]; then
            # Código del estudio nuevo (rama de trabajo, repositorio público) sobre las dependencias ya instaladas.
            git fetch -q https://github.com/${{ github.repository }}.git claude/podcast-estudios && git checkout FETCH_HEAD -- src public scripts/podcast-3-0
            python3 -m pip install -q "onnxruntime==1.31.1" "numpy==2.2.6" "opencv-python-headless==4.10.0.84" "pillow==11.0.0"
            python3 -m pip install -q --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
            python3 -m pip install -q "sentence-transformers==3.3.1"
            if [ "$CASO" = pod-remaster ]; then python3 -m pip install -q "faster-whisper==1.1.1"; fi
            NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" ATOMIVID_RUNTIME=production npx tsx "scripts/qa/real/$CASO.ts"; exit $?
          fi
          if [ "$CASO" = pod-catalog ]; then python3 -m pip install -q "onnxruntime==1.31.1" "numpy==2.2.6" "opencv-python-headless==4.10.0.84" && node scripts/qa/real/pod-catalog.mjs; exit $?; fi
          if [ "$CASO" = pod-assets ]; then POD_ASSETS_ROUND="${{ (inputs.pod_episode_id == 'round2' && '2') || (inputs.pod_episode_id == 'round3' && '3') || '1' }}" POD_ASSETS_MAX_USD="$BUDGET_USD" node scripts/qa/real/pod-assets.mjs; exit $?; fi
          if [ "$CASO" = lf-inspeccion ]; then rc=0; node scripts/qa/real/lf-inspect.mjs || rc=$?
            if [ -f "$RUNNER_TEMP/lf.wav" ]; then pip install -q faster-whisper==1.1.1 && python3 scripts/qa/real/lf-transcribe.py || rc=1; fi; exit $rc; fi
          if [ "$CASO" = lf ]; then node scripts/qa/real/longform-real.mjs; elif [ "$CASO" = descargas ]; then node scripts/qa/real/podcast-downloads.mjs; else node scripts/qa/real/podcast-real.mjs; fi
      - name: Evidencia cifrada (capturas, hechos y descarga) a la rama de evidencias
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -eu
          cd "$RUNNER_TEMP"; [ -d evid ] || exit 0
          rm -f state1.json state2.json
          tar czf evid.tgz evid; openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in evid.tgz -out evid.tgz.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/scripts/qa/real/evidence.pub.pem" -pkeyopt rsa_padding_mode:oaep -in k.txt -out k.enc
          rm -f k.txt evid.tgz
          d="cierre/${{ github.run_id }}-$CASO"; git clone -q --depth 1 --branch claude/evidencias-cierre "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ev 2>/dev/null \
            || { git init -q ev; git -C ev checkout -q -b claude/evidencias-cierre; git -C ev remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"; }
          mkdir -p "ev/$d"; mv evid.tgz.enc k.enc "ev/$d/"
          git -C ev add -A; git -C ev -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "evidencia cifrada $d"
          git -C ev push -q origin claude/evidencias-cierre
          echo "evidencia cifrada: rama claude/evidencias-cierre, carpeta $d"
