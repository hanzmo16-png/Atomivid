name: Aplicar migración de Supabase (autónomo, con verificación)

# Mecanismo autónomo para aplicar migraciones de supabase/migrations/*.sql
# al proyecto real, sin copiar/pegar SQL a mano en el SQL Editor. Siempre:
# 1) verifica el estado actual del esquema remoto ANTES (modo autoritativo
#    vía conexión directa a Postgres si hay credencial, si no vía REST en
#    modo de mejor esfuerzo), 2) aplica automáticamente TODAS las
#    migraciones pendientes en orden — solo si existe una credencial de
#    conexión directa a Postgres (SUPABASE_DB_URL, o SUPABASE_DB_PASSWORD
#    junto con SUPABASE_URL —de donde se deriva el project ref— o
#    SUPABASE_PROJECT_REF explícito) — la service role key NUNCA alcanza
#    para DDL, solo para REST/Storage — y falla de forma clara y segura si
#    no hay ninguna, sin inventar un atajo. Se detiene inmediatamente ante
#    cualquier SQL potencialmente destructivo (ver
#    scripts/apply-supabase-migration.ts) o ante cualquier error, 3) vuelve
#    a verificar en modo autoritativo después. Nunca reaplica una migración
#    ya registrada en public._migrations_applied (idempotente por diseño —
#    correr este workflow de nuevo sin migraciones nuevas no hace nada).
#
# Connection Pooler (2026-09-17): el host de conexión DIRECTA
# (db.<ref>.supabase.co) resuelve hoy solo a IPv6, y este runner no tiene
# salida IPv6 — la conexión directa falla con ENETUNREACH antes de
# autenticar. Se usa en su lugar el Connection Pooler de Supabase, cuyo
# host NO es secreto (es solo un nombre de host, visible en Project
# Settings → Database → Connection Pooler) — el valor por defecto de abajo
# fue derivado de datos 100% públicos (el prefijo IPv6 al que resuelve el
# host directo del proyecto, cruzado contra el ip-ranges.json oficial que
# AWS publica) y confirmado explícitamente por el dueño del proyecto el
# 2026-09-17. Este workflow NUNCA intenta autenticarse automáticamente
# contra un host inferido sin confirmación humana — ver
# scripts/lib/discover-pooler.ts, que solo deriva candidatos (sin usar
# ninguna credencial) para diagnóstico si este valor llegara a fallar.
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: "Opcional: nombre de un archivo puntual en supabase/migrations/ a aplicar (si ya está pendiente). Vacío = aplica TODAS las pendientes, en orden."
        required: false
        type: string
      pooler_host:
        description: "Host del Connection Pooler de Supabase (NO es secreto). Derivado de datos públicos y confirmado el 2026-09-17. Cambia esto solo si Supabase migra el proyecto a otra región de AWS."
        required: false
        type: string
        default: "aws-0-us-west-2.pooler.supabase.com"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar qué credenciales están disponibles (sin exponer valores)
        run: |
          echo "SUPABASE_URL: $([ -n "$SUPABASE_URL" ] && echo presente || echo AUSENTE)"
          echo "SUPABASE_SERVICE_ROLE_KEY: $([ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo presente || echo AUSENTE)"
          echo "SUPABASE_DB_URL: $([ -n "$SUPABASE_DB_URL" ] && echo presente || echo AUSENTE)"
          echo "SUPABASE_PROJECT_REF: $([ -n "$SUPABASE_PROJECT_REF" ] && echo presente || echo AUSENTE)"
          echo "SUPABASE_DB_PASSWORD: $([ -n "$SUPABASE_DB_PASSWORD" ] && echo presente || echo AUSENTE)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || inputs.pooler_host }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}

      - name: Verificar esquema remoto ANTES
        run: npx tsx scripts/verify-remote-schema.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || inputs.pooler_host }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}

      - name: Aplicar migraciones pendientes (requiere conexión directa a Postgres — nunca solo la service role key)
        id: apply
        run: npx tsx scripts/apply-supabase-migration.ts ${{ inputs.migration_file }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || inputs.pooler_host }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}

      - name: Verificar esquema remoto DESPUÉS
        if: always()
        run: npx tsx scripts/verify-remote-schema.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || inputs.pooler_host }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
