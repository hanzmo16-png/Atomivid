name: Recover private documentary draft without provider calls
on:
  push:
    branches: [codex/documentary-editorial-recovery]
    paths: [scripts/diagnose-editorial-citations.ts, .github/workflows/editorial-citation-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/diagnose-editorial-citations.ts
        env:
          RECOVER_PRIVATE_DRAFT: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
