name: Publish authorized account clarity preview branch
on:
  push:
    branches: [codex/privacy-history-repair]
    paths: [.github/workflows/publish-account-clarity.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.run_attempt == 1 && github.actor == 'hanzmo16-png' && github.repository == 'hanzmo16-png/Atomivid'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified commits without changing existing branches
        shell: bash
        run: |
          set -euo pipefail
          cat <<'BUNDLE' | base64 --decode > /tmp/account-clarity.bundle
          
          BUNDLE
          echo '0809dd853131daa9d2e35c7c7eaef87eb01d9acf62bee6b41410eac713fe2df1  /tmp/account-clarity.bundle' | sha256sum -c -
          git bundle verify /tmp/account-clarity.bundle
          test -z "$(git ls-remote --heads origin refs/heads/codex/account-clarity)"
          git fetch /tmp/account-clarity.bundle refs/heads/codex/account-clarity:refs/heads/codex/account-clarity
          test "$(git rev-parse refs/heads/codex/account-clarity)" = '0e1454cacd59365efb7e4dbf603ff5b1a03c00df'
          git push origin refs/heads/codex/account-clarity:refs/heads/codex/account-clarity
