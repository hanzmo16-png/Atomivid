name: Publish authorized account clarity preview branch
on:
  push:
    branches: [codex/privacy-history-repair]
    paths: [.github/workflows/publish-account-clarity.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.run_attempt == 1 && github.actor == 'hanzmo16-png' && github.repository == 'hanzmo16-png/Atomivid'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified recovery fix with a fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          cat <<'BUNDLE' | base64 --decode > /tmp/account-clarity.bundle
          
          BUNDLE
          echo '946811cd5c239bc1c57a6a42ca3e5b7eef5d96ed1b3b994f64ee36527509fe39  /tmp/account-clarity.bundle' | sha256sum -c -
          git bundle verify /tmp/account-clarity.bundle
          test "$(git ls-remote --heads origin refs/heads/codex/account-clarity | cut -f1)" = '0e1454cacd59365efb7e4dbf603ff5b1a03c00df'
          git fetch /tmp/account-clarity.bundle refs/heads/codex/account-clarity:refs/heads/account-clarity-publish
          test "$(git rev-parse refs/heads/account-clarity-publish)" = 'd166f43c044628383b5d2c47b09f7d0ef94107eb'
          git merge-base --is-ancestor '0e1454cacd59365efb7e4dbf603ff5b1a03c00df' refs/heads/account-clarity-publish
          git push origin refs/heads/account-clarity-publish:refs/heads/codex/account-clarity
