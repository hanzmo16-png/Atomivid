name: One-time editor password recovery
on:
  push:
    branches: [codex/editor-password-recovery-20261009]
    paths: [ops/editor-recovery.request]
permissions:
  contents: read
concurrency:
  group: editor-password-recovery-20261009
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reset only the designated editor and seal its new credential
        run: node scripts/review/reset-editor-password.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
