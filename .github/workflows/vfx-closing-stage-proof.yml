name: VFX private launch stage closing proof
on:
  push:
    branches: [codex/vfx-sequence-compositor]
    paths: [scripts/vfx/closing-stage-proof.ts]
permissions:
  contents: read
concurrency:
  group: vfx-closing-stage-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 -m pip install numpy==2.2.6 scipy==1.15.3 pillow==11.3.0 onnxruntime==1.22.1 opencv-python-headless==4.12.0.88 faster-whisper==1.2.0
      - run: node --import tsx scripts/vfx/closing-stage-proof.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: vfx-private-launch-stage-closing
          path: vfx-closing-stage-encrypted/
          retention-days: 7
