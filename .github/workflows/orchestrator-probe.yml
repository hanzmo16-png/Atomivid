name: Orchestrator probe (free, read-only)
# Free checks for the orchestrator pilot: unit tests + simulated demo (USD 0). No secret is read: credentials live in
# the "orchestrator" environment, which branch workflows cannot use. Runs only on pushes to the orchestrator branch.
on:
  push:
    branches: [claude/orchestrator-v1]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Orchestrator tests and simulated demo (USD 0)
        run: |
          node --import tsx --test src/lib/orchestrator/orchestrator.test.ts src/lib/orchestrator/e2e.test.ts src/lib/orchestrator/readiness.test.ts 2>&1 | grep -E "^# (pass|fail)"
          npx tsx scripts/orchestrator/run.ts
          ORCH_MODE=simulate npx tsx scripts/orchestrator/run.ts
