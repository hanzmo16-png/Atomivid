name: Ops e8048599 (autorizado por el propietario)
on:
  push:
    branches: [claude/ops-e8048599]
    paths: [ops/e8048599.mode]
permissions:
  contents: read
  actions: read
concurrency: { group: ops-e8048599, cancel-in-progress: false }
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Optional code checkout for replay
        run: |
          ref=$(sed -n 's/^REPLAY_REF=//p' ops/e8048599.mode)
          if [ -n "$ref" ]; then cp scripts/ops-e8048599.ts /tmp/ops.ts; cp ops/e8048599.mode /tmp/mode; cp .github/workflows/ops-e8048599.yml /tmp/wf.yml
            git fetch -q origin claude/long-form-15min-readiness claude/atomivid-mvp-setup-0079jv claude/json-syntax-12045fcd && cp scripts/ops-quality-e8048599.ts /tmp/q.ts; cp scripts/ops-step-e8048599.ts /tmp/st.ts; cp scripts/ops-unreadable-e8048599.ts /tmp/un.ts; cp scripts/ops-postdeploy.ts /tmp/pd.ts; git checkout -q "$ref" && mkdir -p ops && cp /tmp/mode ops/e8048599.mode && cp /tmp/ops.ts scripts/ops-e8048599.ts && cp /tmp/q.ts scripts/ops-quality-e8048599.ts && cp /tmp/st.ts scripts/ops-step-e8048599.ts && cp /tmp/un.ts scripts/ops-unreadable-e8048599.ts && cp /tmp/pd.ts scripts/ops-postdeploy.ts; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          FAL_ADMIN_KEY: ${{ secrets.FAL_ADMIN_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY != '' && 'set' || '' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "::notice title=PING::step started"
          eval "$(sed -n 's/^\([A-Z_]*\)=\(.*\)$/export \1="\2"/p' ops/e8048599.mode)"
          if [ "$MODE" = "post" ]; then npx tsx scripts/ops-postdeploy.ts > out.txt 2>&1
          elif [ "$MODE" = "unreadable" ]; then npx tsx scripts/ops-unreadable-e8048599.ts > out.txt 2>&1
          elif [ "$MODE" = "forensic" ]; then (MODE=read npx tsx scripts/ops-e8048599.ts; MIN_BLOCK=7 JOB=e8048599 npx tsx scripts/long-form-block-forensic.ts) > out.txt 2>&1
          elif [ "$MODE" = "step" ]; then npx tsx scripts/ops-step-e8048599.ts > out.txt 2>&1
          elif [ "$MODE" = "quality" ]; then npx tsx scripts/ops-quality-e8048599.ts > out.txt 2>&1
          elif [ "$MODE" = "replay" ]; then REPLAY_CINEMATIC=true REPLAY_JOB=e8048599 npx tsx scripts/replay-documentary-job.ts > out.txt 2>&1
          else npx tsx scripts/ops-e8048599.ts > out.txt 2>&1; fi; rc=$?; echo "::notice title=RC::exit=$rc lines=$(wc -l < out.txt)"
          node -e 'require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>/^(JOB|OPS|BUDGET|FAILED|RECRAFT|SNAP|POLICY|FAL|REPLAY|BOUNDARY|MUSIC|VOICE|PROD|PRECHECK|STOP|STEP|END|DRY|DIAG_|PROBE|JOB_E8048599|PAID_OPS|RUNNING_SCRIPT|MODE|PODCAST|\[atomivid:documentary-format)/.test(l)).slice(0,40).forEach((b,i)=>console.log("::notice title=O"+i+"::"+b.slice(0,3800).replace(/%/g,"%25"))); const all=require("fs").readFileSync("out.txt","utf8"); console.log("::notice title=TAIL::"+all.slice(-2500).replace(/%/g,"%25").replace(/\n/g,"%0A"))'
