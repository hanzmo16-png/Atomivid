name: Ops e8048599 (autorizado por el propietario)
on:
  push:
    branches: [claude/ops-e8048599]
    paths: [ops/e8048599.mode]
permissions:
  contents: read
  actions: read
concurrency: { group: ops-e8048599, cancel-in-progress: false }
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Optional code checkout for replay
        run: |
          ref=$(sed -n 's/^REPLAY_REF=//p' ops/e8048599.mode)
          if [ -n "$ref" ]; then mkdir -p /tmp/opsk && cp scripts/ops-*.ts /tmp/opsk/ && cp ops/e8048599.mode /tmp/mode
            git fetch -q origin claude/atomivid-mvp-setup-0079jv && git checkout -q "$ref" && mkdir -p ops && cp /tmp/mode ops/e8048599.mode && cp /tmp/opsk/*.ts scripts/; fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          FAL_ADMIN_KEY: ${{ secrets.FAL_ADMIN_KEY }}
          FAL_KEY: ${{ (contains(github.event.head_commit.message, 'IMAGE-COMPARE') || contains(github.event.head_commit.message, 'RECRAFT-PROBE')) && secrets.FAL_KEY || (secrets.FAL_KEY != '' && 'set' || '') }}
          OPENAI_API_KEY: ${{ contains(github.event.head_commit.message, 'IMAGE-COMPARE') && secrets.OPENAI_API_KEY || '' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "::notice title=PING::step started"
          eval "$(sed -n 's/^\([A-Z_]*\)=\(.*\)$/export \1="\2"/p' ops/e8048599.mode)"
          if [ "$MODE" = "post" ]; then npx tsx scripts/ops-postdeploy.ts > out.txt 2>&1
          elif [ "$MODE" = "unreadable" ]; then npx tsx scripts/ops-unreadable-e8048599.ts > out.txt 2>&1
          elif [ "$MODE" = "forensic" ]; then (MODE=read npx tsx scripts/ops-e8048599.ts; MIN_BLOCK=7 JOB=e8048599 npx tsx scripts/long-form-block-forensic.ts) > out.txt 2>&1
          elif [ "$MODE" = "step" ]; then npx tsx scripts/ops-step-e8048599.ts > out.txt 2>&1
          elif [ "$MODE" = "quality" ]; then npx tsx scripts/ops-quality-e8048599.ts > out.txt 2>&1
          elif [ "$MODE" = "resume" ]; then JOB_ID=e8048599-cf92-45e8-95c8-f145cb9d3be2 EXPECTED_ERROR_CODE=12045fcd EXPECTED_RETRY_COUNT=3 npx tsx scripts/resume-script-job.ts > out.txt 2>&1
          elif [ "$MODE" = "authorize-resume" ]; then npx tsx scripts/ops-authorize-resume.ts > out.txt 2>&1
          elif [ "$MODE" = "migrate-198" ]; then npx tsx scripts/ops-migrate-198.ts > out.txt 2>&1
          elif [ "$MODE" = "walton" ]; then ATOMIVID_RUNTIME=production SUPPLY_GUARD_ENFORCED=true PRICING_ELEVENLABS_USD_PER_1K_CHARS=0.2 npx tsx scripts/ops-walton.ts > out.txt 2>&1
          elif [ "$MODE" = "walton-verify" ]; then sudo apt-get install -yq --no-install-recommends ffmpeg >/dev/null 2>&1; npx tsx scripts/ops-walton-verify.ts > out.txt 2>&1
          elif [ "$MODE" = "leonidas-audit" ]; then npx tsx scripts/ops-leonidas-audit.ts > out.txt 2>&1
          elif [ "$MODE" = "leonidas-plan" ]; then LONG_FORM_MAX_IMAGE_USD=${PLAN_MAX_IMAGE_USD:-5} LONG_FORM_MAX_TOTAL_USD=${PLAN_MAX_TOTAL_USD:-12} LONG_FORM_AI_VIDEO_ENABLED=true PREMIUM_CLIPS_ENABLED=true VIDEO_PROVIDER=veo PRICING_ELEVENLABS_USD_PER_1K_CHARS=0.2 npx tsx scripts/ops-leonidas-plan.ts > out.txt 2>&1
          elif [ "$MODE" = "image-compare" ]; then npx tsx scripts/ops-image-compare.ts > out.txt 2>&1
          elif [ "$MODE" = "recraft-probe" ]; then npx tsx scripts/ops-recraft-probe.ts > out.txt 2>&1
          elif [ "$MODE" = "migrate-studio" ]; then npx tsx scripts/ops-migrate-studio.ts > out.txt 2>&1
          elif [ "$MODE" = "supply" ]; then npx tsx scripts/ops-supply-read.ts > out.txt 2>&1
          elif [ "$MODE" = "replay" ]; then REPLAY_CINEMATIC=true REPLAY_JOB=e8048599 npx tsx scripts/replay-documentary-job.ts > out.txt 2>&1
          else npx tsx scripts/ops-e8048599.ts > out.txt 2>&1; fi; rc=$?; echo "::notice title=RC::exit=$rc lines=$(wc -l < out.txt)"
          node -e 'require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>/^(JOB|OPS|BUDGET|FAILED|RECRAFT|SNAP|POLICY|FAL|REPLAY|BOUNDARY|MUSIC|VOICE|PROD|PRECHECK|STOP|STEP|END|DRY|DIAG_|PROBE|JOB_E8048599|PAID_OPS|RUNNING_SCRIPT|MODE|PODCAST|MIGRATE|RESUME|VOICE|ESTIMATE|EPISODE|AUTHZ|RUN|DELIVERY|LINK|QUALITY|PLAYBACK|PLAN|PLANS|SIM|CANDIDATES|COMPARE|IMAGE|RECRAFT_PROBE|ELIG|MARKS|OP|SUBSET|CORRECTIONS|NARRATIVE|CHECKPOINT|BEATS|FRAMING|TEXT|MEDIA|\[atomivid:documentary-format)/.test(l)).slice(0,48).forEach((b,i)=>console.log("::notice title=O"+i+"::"+b.slice(0,3800).replace(/%/g,"%25"))); const all=require("fs").readFileSync("out.txt","utf8"); console.log("::notice title=TAIL::"+all.slice(-2500).replace(/%/g,"%25").replace(/\n/g,"%0A"))'
      - name: Report part 1
        if: always()
        run: |
          [ -f out.txt ] || exit 0
          node -e 'const L=require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>l.trim()); L.slice(9,18).forEach((b,i)=>console.log("::notice title=P1_"+i+"::"+b.slice(0,3900).replace(/%/g,"%25")))'
      - name: Report part 2
        if: always()
        run: |
          [ -f out.txt ] || exit 0
          node -e 'const L=require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>l.trim()); L.slice(18,27).forEach((b,i)=>console.log("::notice title=P2_"+i+"::"+b.slice(0,3900).replace(/%/g,"%25")))'
      - name: Report part 3
        if: always()
        run: |
          [ -f out.txt ] || exit 0
          node -e 'const L=require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>l.trim()); L.slice(27,36).forEach((b,i)=>console.log("::notice title=P3_"+i+"::"+b.slice(0,3900).replace(/%/g,"%25")))'
      - name: Report part 4
        if: always()
        run: |
          [ -f out.txt ] || exit 0
          node -e 'const L=require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>l.trim()); L.slice(36,45).forEach((b,i)=>console.log("::notice title=P4_"+i+"::"+b.slice(0,3900).replace(/%/g,"%25")))'
      - name: Report part 5
        if: always()
        run: |
          [ -f out.txt ] || exit 0
          node -e 'const L=require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>l.trim()); L.slice(45,54).forEach((b,i)=>console.log("::notice title=P5_"+i+"::"+b.slice(0,3900).replace(/%/g,"%25")))'
      - name: Report part 6
        if: always()
        run: |
          [ -f out.txt ] || exit 0
          node -e 'const L=require("fs").readFileSync("out.txt","utf8").split("\n").filter(l=>l.trim()); L.slice(54,63).forEach((b,i)=>console.log("::notice title=P6_"+i+"::"+b.slice(0,3900).replace(/%/g,"%25")))'
      - name: Comparison artifact
        if: always() && hashFiles('comparison/**') != ''
        uses: actions/upload-artifact@v4
        with: { name: image-comparison, path: comparison/, retention-days: 14 }
