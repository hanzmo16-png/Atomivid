name: Video 004 review proxy (free: FFmpeg only, no provider API)

# Builds a single-object 480p review MP4 from the EXISTING 1080p master parts in Supabase Storage,
# uploads it beside the master and verifies the signed link anonymously. No generation, no paid call.
on:
  workflow_dispatch:
  push:
    branches: [claude/production-intelligence-v1]
    paths: [.github/workflows/video-004-review-proxy.yml]
permissions:
  contents: read
jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: npx tsx scripts/video-004/review-proxy.ts
        env:
          V4_OUT: ${{ runner.temp }}/video-004-review
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-004-review-link
          path: ${{ runner.temp }}/video-004-review/review-link.json
          if-no-files-found: ignore
