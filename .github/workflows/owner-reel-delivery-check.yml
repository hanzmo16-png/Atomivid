name: Check accepted owner reel delivery (no generation)
on:
  push:
    branches: [codex/vfx-sequence-compositor]
    paths: [scripts/owner-reel-delivery-check.ts, .github/workflows/owner-reel-delivery-check.yml]
permissions:
  contents: read
concurrency:
  group: owner-reel-delivery-readback
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/owner-reel-delivery-check.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
