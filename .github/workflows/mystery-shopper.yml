name: Private technical Long Form QA preparation (no generation)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [review, apply-and-quote, quote]
        default: review
      new_request_id:
        description: New canonical UUID; review never inserts, apply requires exact root-reviewed receipt
        required: true
        type: string
      review_receipt:
        description: Exact private review receipt path already inspected by root (required to apply or quote)
        type: string
      accepted_review_sha:
        description: Exact review SHA256 accepted by root after reading private payload
        type: string
permissions:
  contents: read
concurrency:
  group: mystery-shopper-real-campaign-320
  cancel-in-progress: false
jobs:
  prepare:
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
      MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
      MS_NEW_REQUEST_ID: ${{ inputs.new_request_id }}
      MS_REVIEW_RECEIPT: ${{ inputs.review_receipt }}
      MS_ACCEPTED_REVIEW_SHA: ${{ inputs.accepted_review_sha }}
      MS_OUT_DIR: ${{ runner.temp }}/technical-rerender-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Prepare private review plan from the completed genuine source only
        if: inputs.operation == 'review' || inputs.operation == 'apply-and-quote'
        env:
          MS_TECHNICAL_OPERATION: ${{ inputs.operation == 'apply-and-quote' && 'apply' || 'review' }}
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/prepare-technical-rerender.ts > "$RUNNER_TEMP/technical-rerender-private.log" 2>&1 || { echo 'Private QA preparation blocked. Inspect state before any manual retry; no generation was sent.'; exit 1; }
          echo 'Private QA preparation completed. Root review receipt governs insertion; paid generation remains disabled.'
      - name: Install read-only quote browser
        if: inputs.operation == 'apply-and-quote' || inputs.operation == 'quote'
        run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Read authentic UI quote; all post-login app mutations blocked
        if: inputs.operation == 'apply-and-quote' || inputs.operation == 'quote'
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/technical-rerender-quote.mjs > "$RUNNER_TEMP/technical-quote-private.log" 2>&1 || { echo 'Private quote blocked; no confirmation, reserve or generation.'; exit 1; }
          echo 'Quote and screenshot stored in private Storage only. No paid request sent.'
