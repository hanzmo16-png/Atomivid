name: Endgame Audio private execution
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, run]
        default: validate
permissions:
  contents: read
concurrency:
  group: mystery-shopper-real-campaign-320
  cancel-in-progress: false
jobs:
  native-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.voice.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - id: voice
        name: Check native worker configuration without provider calls
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AUDIO_STUDIO_PAID_TTS: ${{ vars.AUDIO_STUDIO_PAID_TTS }}
          AUDIO_STUDIO_ELEVENLABS_VOICES: ${{ vars.AUDIO_STUDIO_ELEVENLABS_VOICES }}
          AUDIO_STUDIO_VOICE: ${{ vars.AUDIO_STUDIO_VOICE || 'demo' }}
        run: |
          node --import tsx --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {voiceAvailability} from './src/lib/audio-studio/voice.ts';
          import {modelRate} from './src/lib/audio-studio/model.ts';
          const v=voiceAvailability(process.env,m=>modelRate(m).rate,{owner:false});
          const ready=v.ok && v.voice.mode==='elevenlabs';
          appendFileSync(process.env.GITHUB_OUTPUT,`ready=${ready}\n`);
          console.log(ready ? 'Native real-voice configuration available; no generation performed.' : 'BLOCKED: native real-voice configuration unavailable. No provider call.');
          JS
  audio:
    if: inputs.operation == 'run' && needs.native-config.outputs.ready == 'true'
    needs: native-config
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - id: create
        name: Reserve one bounded evaluation; details stay private
        env:
          MS_MISSION: audio-real-es
          MS_MODE: real
          MS_MAX_BUDGET_USD: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/manual-start.ts > "$RUNNER_TEMP/manual-private.log" 2>&1 || { echo 'BLOCKED: private evaluation setup failed.'; exit 1; }
      - name: Authenticated Audio journey; evidence remains in private app storage
        env:
          MS_JOB_ID: ${{ steps.create.outputs.job }}
          MYSTERY_SHOPPER_REAL_ENABLED: '1'
          MS_AUDIO_PROJECT_ID: 9241d2a6-064b-4ecc-9fd7-6b2bf4594d12
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MS_OUT_DIR: ${{ runner.temp }}/private-audio
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/worker.ts > "$RUNNER_TEMP/audio-private.log" 2>&1 || { echo 'BLOCKED or FAIL: consult existing private application evidence. No automatic retry.'; exit 1; }
          echo 'Worker finished; commercial result must be read from private application evidence.'
