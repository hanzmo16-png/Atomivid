name: focused-longform-readonly
on:
  workflow_dispatch:
    inputs:
      audio_receipt_diagnostic:
        description: Read only pinned failed Audio receipt from closed run 45858583620; no browser
        required: false
        type: boolean
        default: false
      audio_surfaces_only:
        description: Skip already-proven focused LF AV onboarding; run existing Audio and surfaces both widths
        required: false
        type: boolean
        default: false
      continue_412:
        description: Focused LF AV onboarding only at 412; existing Audio helper still tests both widths
        required: false
        type: boolean
        default: false
      receipt_diagnostic:
        description: Read only closed run 45856688839 receipts; never starts browser
        required: false
        type: boolean
        default: false
      existing_av_id:
        description: Optional existing QA-owned ready audiovisual studio episode UUID
        required: false
        type: string
      expected_av_sha256:
        description: Optional root-verified existing audiovisual video full SHA256
        required: false
        type: string
      existing_audio_id:
        description: Existing QA-owned real Audio Studio project UUID
        required: false
        type: string
      existing_lf_id:
        description: Existing QA-owned completed Long Form UUID
        required: false
        type: string
      expected_sha256:
        description: Root-verified canonical full video SHA256
        required: false
        type: string
      production_commit:
        description: Root-verified READY production commit
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: focused-longform-readonly
  cancel-in-progress: false
jobs:
  smoke:
    if: ${{ !inputs.receipt_diagnostic && !inputs.audio_receipt_diagnostic }}
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MS_CONTINUE_412: ${{ inputs.continue_412 && '1' || '0' }}
      MS_EXISTING_AV_ID: ${{ inputs.existing_av_id }}
      MS_EXPECTED_AV_SHA256: ${{ inputs.expected_av_sha256 }}
      MS_EXISTING_AUDIO_ID: ${{ inputs.existing_audio_id }}
      MS_EXISTING_LF_ID: ${{ inputs.existing_lf_id }}
      MS_EXPECTED_LF_SHA256: ${{ inputs.expected_sha256 }}
      MS_EXPECTED_PRODUCTION_COMMIT: ${{ inputs.production_commit }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
      MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/mystery-shopper/final-readonly-policy.test.mjs scripts/mystery-shopper/readonly-media-stream.test.mjs
      - name: Production read-only mobile smoke; evidence exclusively in private Storage
        if: ${{ !inputs.audio_surfaces_only }}
        run: node scripts/mystery-shopper/focused-longform-readonly.mjs
      - name: Existing authentic Audio MP3 and module surfaces; private evidence only
        run: node scripts/mystery-shopper/final-authenticated-readonly.mjs
  receipt-readback:
    if: ${{ inputs.receipt_diagnostic }}
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact closed-run private receipt aggregate only
        run: node scripts/mystery-shopper/closed-run-receipt-reader.mjs
        env:
          MS_RECEIPT_DIAGNOSTIC: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
  audio-receipt-readback:
    if: ${{ inputs.audio_receipt_diagnostic }}
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact pinned closed-run Audio receipt aggregate only
        run: node scripts/mystery-shopper/closed-run-audio-receipt-reader.mjs
        env:
          MS_RECEIPT_DIAGNOSTIC: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
