name: Endgame private Long Form resume
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mystery-shopper-real-campaign-320
  cancel-in-progress: false
jobs:
  longform:
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Reuse only an already paid and completed QA script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/mystery-shopper/prepare-existing-longform.mjs
      - id: create
        name: Reserve one bounded evaluation; details stay private
        env:
          MS_TARGET: https://atomivid-pbuerx6ey-atomivid.vercel.app
          MS_MISSION: youtube-real
          MS_MODE: real
          MS_MAX_BUDGET_USD: '2'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/manual-start.ts > "$RUNNER_TEMP/manual-private.log" 2>&1 || { echo 'BLOCKED: private evaluation setup failed.'; exit 1; }
      - name: Existing Long Form preparation; evidence remains private
        env:
          MS_JOB_ID: ${{ steps.create.outputs.job }}
          MYSTERY_SHOPPER_REAL_ENABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MS_OUT_DIR: ${{ runner.temp }}/private-longform
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/worker.ts > "$RUNNER_TEMP/longform-private.log" 2>&1 || { echo 'BLOCKED or FAIL: consult existing private application evidence. No automatic retry.'; exit 1; }
          echo 'Worker finished; commercial result must be read from private application evidence.'
      - name: Save journey result only inside private application storage
        if: always()
        env:
          MS_JOB_ID: ${{ steps.create.outputs.job }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MS_OUT_DIR: ${{ runner.temp }}/private-longform
        run: node scripts/mystery-shopper/private-longform-receipt.mjs
