# Mystery Shopper 2.0 — el worker real. Playwright corre aquí (GitHub Actions), nunca en Vercel serverless.
# Gratuito por defecto; campaign-real exige despacho explícito, topes y ledger acumulado existente.
#
#  - repository_dispatch «mystery-shopper-run»: lo envía el panel (Command Center) al crear una evaluación.
#  - deployment_status: Vercel avisa de un Preview listo; si el CI del SHA está verde, corren las misiones automáticas.
#  - workflow_dispatch: repetir a mano un trabajo existente por su id.
#  - pull_request: pruebas del módulo y E2E autenticado en el arnés local (cuenta QA local, USD 0).
name: Mystery Shopper AI
on:
  schedule:
    - cron: "17,47 * * * *"
  repository_dispatch:
    types: [mystery-shopper-run]
  deployment_status:
  workflow_dispatch:
    inputs:
      operation:
        description: Evaluar gratis, diagnosticar QA o ejecutar campaña autorizada con topes
        type: choice
        options: [evaluate, qa-preflight, observe-reel, campaign-real, quality-loop]
        default: evaluate
      audio_project_id:
        description: Episodio QA existente sin gasto para recuperar configuración sin duplicarlo
        required: false
        default: ""
      observe_request_id:
        description: Id de Reel existente para observar/descargar sin reenviar render
        required: false
        default: ""
      qa_environment:
        description: Ámbito de bindings existentes (solo diagnóstico QA)
        type: choice
        options: [Preview, orchestrator]
        default: Preview
      job_id:
        description: Id de una evaluación ya creada (ms-...). Vacío = crear una nueva con la misión y el perfil de abajo.
        required: false
        default: ""
      mission:
        description: Misión (solo si job_id está vacío)
        required: false
        default: cuenta-navegacion
      profile:
        description: Perfil (principiante, impaciente, creador, profesional)
        required: false
        default: principiante
  pull_request:
    paths:
      - src/lib/mystery-shopper/**
      - src/app/dashboard/command-center/**
      - src/app/api/admin/mystery-shopper/**
      - scripts/mystery-shopper/**
      - scripts/harness/e2e/mystery-shopper/**
      - scripts/harness/e2e/infra/gateway.mjs
      - .github/workflows/mystery-shopper.yml
permissions:
  contents: read
  checks: read
  statuses: read
jobs:
  qa-preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'qa-preflight' || inputs.operation == 'observe-reel')
    environment: ${{ inputs.qa_environment || 'orchestrator' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.operation == 'observe-reel' && 25 || 5 }}
    concurrency:
      group: mystery-shopper-qa-preflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Verificar cuenta QA sin crear trabajos ni reservar gasto
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          COMMAND_CENTER_ADMIN_EMAILS: ${{ secrets.COMMAND_CENTER_ADMIN_EMAILS }}
          MS_OUT_DIR: ${{ runner.temp }}/qa-preflight
        run: node --import tsx scripts/mystery-shopper/qa-preflight.ts
      - name: Navegador móvil de solo lectura
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Verificar acceso móvil y leer ledger acumulado sin reservar
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          MS_OUT_DIR: ${{ runner.temp }}/qa-preflight
          MS_OBSERVE_REEL_ID: ${{ inputs.operation == 'observe-reel' && inputs.observe_request_id || '' }}
        run: node --import tsx scripts/mystery-shopper/qa-authenticated-readonly.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-preflight
          if-no-files-found: error
          retention-days: 7
  # Un trabajo pedido desde el panel o a mano. El claim atómico del trabajo evita dobles ejecuciones;
  # Un único grupo serializa toda la campaña para impedir gasto paralelo del mismo ledger.
  evaluar:
    environment: Preview
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'qa-preflight' && inputs.operation != 'observe-reel' && inputs.operation != 'quality-loop')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    concurrency:
      group: mystery-shopper-campaign-real-serialized
      cancel-in-progress: false
    steps:
      - name: Alcance de campaña real autorizado
        if: inputs.operation == 'campaign-real'
        env:
          MISSION: ${{ inputs.mission }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          [[ -z "$JOB_ID" && ( "$MISSION" == "audio-real-es" || "$MISSION" == "youtube-real" || "$MISSION" == "reels-real" ) ]] || { echo "::error::Campaña real limitada a Audio ES, YouTube o Reel nuevos; sin reintento automático"; exit 1; }
      - name: Id de trabajo válido
        env:
          JOB: ${{ github.event.client_payload.jobId || inputs.job_id }}
        run: '[[ -z "$JOB" || "$JOB" =~ ^ms-[a-z0-9][a-z0-9-]{7,90}$ ]] || { echo "::error::id no válido"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Crear o reutilizar la evaluación (reserva atómica)
        id: trabajo
        env:
          MS_JOB_ID: ${{ github.event.client_payload.jobId || inputs.job_id }}
          MS_MISSION: ${{ inputs.mission || 'cuenta-navegacion' }}
          MS_PROFILE: ${{ inputs.profile || 'principiante' }}
          MS_MODE: ${{ inputs.operation == 'campaign-real' && 'real' || 'gratuito' }}
          MS_MAX_BUDGET_USD: ${{ inputs.mission == 'audio-real-es' && '1' || inputs.mission == 'reels-real' && '1.5' || '2' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/mystery-shopper/manual-start.ts
      # playwright no es dependencia de la app: se instala aquí (sin tocar package.json) antes del navegador.
      - run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Recorrido con navegador nuevo
        env:
          MS_JOB_ID: ${{ steps.trabajo.outputs.job }}
          MYSTERY_SHOPPER_REAL_ENABLED: ${{ inputs.operation == 'campaign-real' && '1' || '0' }}
          MS_AUDIO_PROJECT_ID: ${{ inputs.mission == 'audio-real-es' && inputs.audio_project_id || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MS_WORKER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MS_OUT_DIR: ${{ runner.temp }}/ms
        run: npx tsx scripts/mystery-shopper/worker.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mystery-shopper-${{ steps.trabajo.outputs.job || github.run_id }}
          retention-days: 30
          path: ${{ runner.temp }}/ms
          if-no-files-found: ignore

  # Periodic and post-deployment entrypoint. No production Storage jobs or paid work.
  quality-loop:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'quality-loop') ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.ref == github.event.repository.default_branch)
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: mystery-shopper-quality-loop
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Browser only, no provider SDK or financial credentials
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Checkout y recuperación en fixtures aisladas (sin Stripe ni producción)
        run: node --import tsx --test src/lib/billing/checkout.test.ts src/lib/billing/checkout-error.test.ts src/lib/auth/recovery.test.ts src/lib/auth/recovery-flow.test.ts src/lib/mystery-shopper/v3/start-response.test.ts
      - name: Recorrido periódico no mutante
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Explicit activation requested by Hans 26-Nov. Repo variable 0 and admin state STOP both stop it.
          MYSTERY_SHOPPER_AUTO: ${{ vars.MYSTERY_SHOPPER_AUTO || '1' }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          AQL_TRIGGER: ${{ github.event_name }}
          AQL_PUBLIC_REPO: ${{ !github.event.repository.private }}
          AQL_EXPECTED_SHA: ${{ github.event.deployment.sha }}
          AQL_DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          AQL_DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
          MS_TARGET_URL: https://atomivid.vercel.app
          MS_OUT_DIR: ${{ runner.temp }}/quality-loop
        run: node --import tsx scripts/mystery-shopper/quality-loop/run.ts
      - name: Alerta de interrupción (sin datos privados)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/quality-loop
        run: |
          if [[ ! -f "$OUT/cycle.json" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/320/comments" -f "body=Quality Loop: ejecución interrumpida o preflight bloqueado. Revisar $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No se declara evaluación completada ni activación de agente externo."
          fi
      # Periodic results persist in the CAS state branch and private Drive, without recurring artifact storage.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: quality-loop-${{ github.run_id }}
          path: ${{ runner.temp }}/quality-loop
          if-no-files-found: warn
          retention-days: 1

  quality-loop-drive:
    needs: quality-loop
    if: always() && needs.quality-loop.result != 'skipped' && github.ref_name == github.event.repository.default_branch
    environment: orchestrator
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: quality-loop-drive-mirror
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Copia y encargos en Drive, con lectura de vuelta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AQL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node --import tsx scripts/mystery-shopper/quality-loop/mirror.ts

  # Pruebas del módulo + E2E autenticado en el arnés local (ATOMIVID de este SHA, cuenta QA local, USD 0).
  pruebas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_HOME: ${{ github.workspace }}/.e2e-local
      E2E_PGPORT: "55532"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependencias del sistema
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-17 ffmpeg xz-utils
          sudo systemctl stop postgresql || true
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Quality loop regression and controlled browser cycle (isolated fixtures)
        run: |
          node --import tsx --test src/lib/mystery-shopper/quality-loop/*.test.ts
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node --import tsx --test scripts/mystery-shopper/quality-loop/*.test.ts scripts/mystery-shopper/readonly.browser.test.ts
      - name: Pruebas unitarias del módulo
        run: node --import tsx --test --test-concurrency=1 src/lib/mystery-shopper/ms2.test.ts src/lib/mystery-shopper/mystery-shopper.test.ts src/lib/mystery-shopper/media.test.ts src/app/dashboard/command-center/mystery-shopper/panel.test.tsx
      - name: Regresiones de campañas y autenticación QA
        run: node --import tsx --test --test-concurrency=1 src/lib/mystery-shopper/v3/*.test.ts
      - name: Arnés local
        run: bash scripts/harness/e2e/infra/setup.sh
      - name: E2E autenticado (panel → trabajo → worker → informe)
        run: |
          set -o pipefail
          bash scripts/harness/e2e/mystery-shopper/run.sh ci 2>&1 | tee ms-e2e.log
          grep -Eq '^RESULTADO ([0-9]+)/\1 PASS$' ms-e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mystery-shopper-e2e
          retention-days: 14
          path: |
            ms-e2e.log
            .e2e-local/out/mystery-shopper
          if-no-files-found: ignore
