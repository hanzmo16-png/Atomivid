name: Endgame private audiovisual QA journey
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight, run]
        default: preflight
permissions:
  contents: read
concurrency:
  group: mystery-shopper-real-campaign-320
  cancel-in-progress: false
jobs:
  audiovisual:
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg && npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Refuse paid AV until the active native CLI protects financial logs
        if: inputs.operation == 'run'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://api.github.com/repos/hanzmo16-png/Atomivid/contents/scripts/podcast-3-0/studio-worker.ts',{headers:{Authorization:`Bearer ${process.env.GH_READ_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('Native privacy gate not readable; no generation');
          const j=await r.json(),s=Buffer.from(j.content,'base64').toString();
          if(!s.includes('JSON.stringify(publicStudioReadiness(r))')||s.split('\n').some(l=>l.includes('console.log')&&/spentUsd|paidOps|reusedOps|\.free|\.detail/.test(l)))throw Error('BLOCKED: native privacy correction not active; no generation');
          console.log('Native privacy preflight passed; no provider call.');
          JS
      - id: create
        name: Reserve one bounded evaluation; details stay private
        env:
          MS_TARGET: https://atomivid-fkihd0zkk-atomivid.vercel.app
          MS_MISSION: video-podcast-real
          MS_MODE: ${{ inputs.operation == 'run' && 'real' || 'gratuito' }}
          MS_MAX_BUDGET_USD: '3'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/manual-start.ts > "$RUNNER_TEMP/manual-private.log" 2>&1 || { echo 'BLOCKED: private evaluation setup failed.'; exit 1; }
      - name: Audiovisual wizard; all evidence stays in private application storage
        env:
          MS_JOB_ID: ${{ steps.create.outputs.job }}
          MYSTERY_SHOPPER_REAL_ENABLED: ${{ inputs.operation == 'run' && '1' || '0' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MS_OUT_DIR: ${{ runner.temp }}/private-av
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/worker.ts > "$RUNNER_TEMP/av-private.log" 2>&1 || { echo 'BLOCKED or FAIL: consult existing private application evidence. No automatic retry.'; exit 1; }
          echo 'Worker finished; commercial result must be read from private application evidence.'
      - name: Store readback only inside the existing private application bucket
        if: always()
        env:
          MS_JOB_ID: ${{ steps.create.outputs.job }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MS_OUT_DIR: ${{ runner.temp }}/private-av
        run: node scripts/mystery-shopper/private-av-receipt.mjs
