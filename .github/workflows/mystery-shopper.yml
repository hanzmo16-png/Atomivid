name: Private Endgame readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-readback:
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Read existing campaign only and seal output
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRIVATE_OUT: ${{ runner.temp }}/sealed
        run: node scripts/mystery-shopper/private-readback.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-private-readback
          path: ${{ runner.temp }}/sealed/sealed.json
          if-no-files-found: error
          retention-days: 1
