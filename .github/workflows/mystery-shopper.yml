name: commercial-authenticated-readonly
on:
  workflow_dispatch:
    inputs:
      billing_only:
        description: Complete only billing and existing delivery checks after uppercase-label helper correction
        type: boolean
        required: false
        default: false
      authenticated_only:
        description: Continue only the authenticated commercial journey already blocked by the navigation helper race
        type: boolean
        required: false
        default: false
      receipt_diagnostic:
        description: Read only the specifically authorized failed commercial receipt
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: commercial-authenticated-readonly
  cancel-in-progress: false
jobs:
  smoke:
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMMERCIAL_BILLING_ONLY: ${{ inputs.billing_only && '1' || '0' }}
      COMMERCIAL_AUTHENTICATED_ONLY: ${{ inputs.authenticated_only && '1' || '0' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
      MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: ${{ !inputs.receipt_diagnostic }}
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
      - if: ${{ !inputs.receipt_diagnostic }}
        run: npx playwright install --with-deps chromium
      - run: node --test scripts/mystery-shopper/commercial-policy.test.mjs
      - name: Focused commercial read-only verification; private Storage evidence only
        if: ${{ !inputs.receipt_diagnostic }}
        run: node scripts/mystery-shopper/commercial-readonly.mjs
      - name: Bounded existing receipt diagnostic; private Storage metadata only
        if: ${{ inputs.receipt_diagnostic }}
        run: node scripts/mystery-shopper/commercial-receipt-diag.mjs
