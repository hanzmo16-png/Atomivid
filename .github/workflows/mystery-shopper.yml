name: Private campaign balance receipt
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  settle:
    concurrency:
      group: mystery-shopper-real-campaign-320
      cancel-in-progress: false
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Verify accumulated ledger and save receipt inside private application storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_READ_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/mystery-shopper/private-balance-receipt.mjs
