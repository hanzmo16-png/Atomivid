name: E2E YouTube flow from the app (owner-authorized, max USD 5)
# Drives the REAL production app in a browser as the owner (authorized 2026-10-09 for one test
# production, max USD 5 including the script). No provider keys here: every paid call happens inside
# the deployed app, under its own budget, supply and ledger controls. Logs carry statuses/amounts only.
on:
  push:
    branches: [claude/youtube-flow-from-app]
    paths: [ops/e2e-app.mode]
permissions:
  contents: read
concurrency:
  group: e2e-app-youtube
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Run the in-app flow
        run: npx tsx scripts/e2e-app-youtube.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
