name: Orchestrator (manual, gated)
# The smoke run with its phrase gets a fixed title: run.ts reads this repository's history and refuses a second one.
run-name: ${{ (inputs.mode == 'smoke' && inputs.paid_approval == 'HUMO-0.05USD' && 'Orchestrator smoke (paid)') || format('Orchestrator {0}', inputs.mode) }}
# Manual only (no schedule yet). Runs one cycle over the Drive channel. Every paid call is gated server-side:
# ORCHESTRATOR_ENABLED, ORCH_ALLOW_PAID_CALLS (repository variables Hans controls), the exact approval phrase typed
# at dispatch time, a durable store, and the budget ledger (pilot cap USD 5). Without them the simulated auditor
# (USD 0) is used. Never merges, deploys or touches Atomivid's production data.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "simulate = ciclo completo contra un Drive simulado (USD 0, sin secretos); live = un ciclo sobre Drive; preflight = compuertas del humo sin enviar (USD 0); smoke = UNA auditoría real (tope USD 0.05, una sola vez)"
        required: true
        default: simulate
        type: choice
        options: [simulate, live, preflight, smoke]
      paid_approval:
        description: "Vacío = USD 0. Piloto: escribe exactamente GASTAR-HASTA-5USD. Humo: escribe exactamente HUMO-0.05USD"
        required: false
        default: ""
permissions:
  contents: read
  # Notices, and the smoke call's atomic claim (creating a repository label is unique).
  issues: write
  # Reads this workflow's run history (smoke guard) and dispatches claude-executor.yml (workflow_dispatch).
  actions: write
concurrency:
  group: orchestrator
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Default branch only; Google secrets live in the "orchestrator" environment (restricted to that branch).
    if: (vars.ORCHESTRATOR_ENABLED == 'true' || inputs.mode == 'preflight' || inputs.mode == 'simulate') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: orchestrator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/orchestrator/run.ts
        env:
          ORCH_MODE: ${{ inputs.mode }}
          ORCHESTRATOR_ENABLED: ${{ vars.ORCHESTRATOR_ENABLED }}
          ORCH_ALLOW_PAID_CALLS: ${{ vars.ORCH_ALLOW_PAID_CALLS }}
          ORCH_PAID_APPROVAL: ${{ inputs.paid_approval }}
          ORCH_STORE: ${{ vars.ORCH_STORE }}
          ORCH_OPENAI_MODEL: ${{ vars.ORCH_OPENAI_MODEL }}
          ORCH_CLAUDE_ACTION_ENABLED: ${{ vars.ORCH_CLAUDE_ACTION_ENABLED }}
          ORCH_DRIVE_SOLICITUDES: 1WJ4FpKjMvOpn60i3diyy7sL7uDQfZp9W
          ORCH_DRIVE_ENTREGAS: 1z8C1ZnE8rh9iUUiEYQrNU-x7VMzCI4SJ
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          # Dedicated key of a dedicated OpenAI project (own spend limit), kept in the "orchestrator" environment: never
          # the app's shared OPENAI_API_KEY, which any branch workflow could read.
          OPENAI_API_KEY: ${{ (vars.ORCH_ALLOW_PAID_CALLS == 'true' && inputs.mode != 'preflight' && secrets.ORCH_OPENAI_API_KEY) || '' }}
          OPENAI_KEY_PRESENT: ${{ secrets.ORCH_OPENAI_API_KEY != '' }}
          # Durable store: a dedicated project/key in the "orchestrator" environment, never the app's production keys.
          ORCH_SUPABASE_URL: ${{ (vars.ORCH_STORE == 'supabase' && secrets.ORCH_SUPABASE_URL) || '' }}
          ORCH_SUPABASE_SERVICE_ROLE_KEY: ${{ (vars.ORCH_STORE == 'supabase' && secrets.ORCH_SUPABASE_SERVICE_ROLE_KEY) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NOTICE_MENTION: ${{ github.repository_owner }}
