name: Runway connection verification (one 10s clip)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "GASTAR: one 10s clip, maximum USD0.50; no credit purchase"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: runway-connection-20260928
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f421efa96d172b3a84037d4dd0f54f5d676c199
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify one Runway clip with production adapter and durable storage
        env:
          CONFIRM: ${{ inputs.confirm }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          VIDEO_PROVIDER: runway
          PREMIUM_CLIPS_ENABLED: 'true'
          LONG_FORM_AI_VIDEO_ENABLED: 'true'
        run: |
          cat > .runway-live-smoke.ts <<'TS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { createClient } from '@supabase/supabase-js';
          import sharp from 'sharp';
          import { getVideoProvider } from './src/lib/providers/video-gen';
          import { buildRunwayPayload } from './src/lib/providers/video-gen/runway';
          import { wrapDurableVideoProvider } from './src/lib/video/long-form/ai-video-durable-provider';
          import { readAiVideoClipRecord, validateExistingAiVideoClip } from './src/lib/video/long-form/ai-video-storage';
          import { validateVideoAssetBuffer } from './src/lib/video/long-form/ai-video-validation';
          async function main() {
            assert.equal(process.env.CONFIRM, 'GASTAR');
            const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!,process.env.SUPABASE_SERVICE_ROLE_KEY!,{auth:{persistSession:false}});
            const bucket = supabase.storage.from('videos');
            const scopeId = 'runway-connection-20260928';
            const shotId = 'dulce-laboratorio-10s-v1';
            const sha = (b:Buffer) => createHash('sha256').update(b).digest('hex');
            const ref = await bucket.download('dulce-001/samples/pilot/ai/dulce-d04-v1-still.png');
            if (ref.error || !ref.data) throw Error('Reference download failed');
            const source = Buffer.from(await ref.data.arrayBuffer());
            assert.equal(sha(source),'578f5dfa0e40fda6cb7264456dfecdc71da46017a6314b193906ff46d71ae308');
            const jpeg = await sharp(source).resize(1280,720,{fit:'cover'}).jpeg({quality:92}).toBuffer();
            const provider = getVideoProvider('runway');
            assert.equal(provider.name,'runway');
            assert.equal(provider.isAvailable(),true);
            const request = {
              prompt: 'Photoreal cinematic science-fiction laboratory, one continuous shot. A visible pulse of pale cyan light travels from the left glass chamber along the overhead connecting apparatus to the right chamber. Small indicator lamps blink in sequence. Fine vapor curls around the chamber bases. The adult humanoid in the right chamber slowly raises one hand and flexes its fingers. The clothed adult person in the left chamber breathes and turns his head slightly. Slow lateral dolly reveals parallax between the two chambers. Preserve both separate occupants, chamber geometry and industrial lighting. No cuts, no text, no gore.',
              referenceImageUrl:'data:image/jpeg;base64,'+jpeg.toString('base64'),
              aspectRatio:'16:9' as const, durationSeconds:10,maxCostUsd:0.5,
              metadata:{shotId}
            };
            buildRunwayPayload(request);
            const ordinary = await bucket.download('long-form/'+scopeId+'/state/ai-video/'+shotId+'.json');
          const ordinaryRecord = ordinary.data ? JSON.parse(await ordinary.data.text()) : null;
          const fresh = await readAiVideoClipRecord(supabase,'videos',scopeId,shotId);
          console.log(JSON.stringify({ordinaryStatus:ordinaryRecord?.status,freshStatus:fresh?.status,freshUpdatedAt:fresh?.updatedAtIso}));
          assert.equal(fresh?.status,'COMPLETED','Recovery check must reuse a completed clip; new generation forbidden');
          let submissions = 0;
            const beforeSubmit = async () => {
              throw Error('Read-only recovery: paid submissions forbidden');
              const claim = await bucket.upload('long-form/'+scopeId+'/submission-claim.json',Buffer.from(JSON.stringify({shotId,maxCostUsd:0.5,createdAt:new Date().toISOString()})),{contentType:'application/json',upsert:false});
              if(claim.error) throw Error('Existing or inaccessible submission claim: reconcile before retry');
              return true;
            };
            const durable = wrapDurableVideoProvider(provider,{supabase,scopeId,beforeSubmit,maxInAttemptResumes:2});
            const asset = await durable.generateVideo(request);
            assert.deepEqual(validateVideoAssetBuffer(asset.buffer,asset.mimeType),{valid:true,format:'mp4'});
            await fs.mkdir('evidence/runway',{recursive:true});
            const output = 'evidence/runway/Atomivid-Runway-Laboratorio-Verificado.mp4';
            await fs.writeFile(output,asset.buffer);
            const record = await readAiVideoClipRecord(supabase,'videos',scopeId,shotId);
            assert.equal(record?.status,'COMPLETED');
            assert.equal(record?.provider,'runway');
            assert.ok(await validateExistingAiVideoClip(supabase,'videos',record!));
            const reused = await wrapDurableVideoProvider(provider,{supabase,scopeId,beforeSubmit:async()=>{throw Error('Unexpected second charge');}}).generateVideo(request);
            assert.equal(sha(reused.buffer),sha(asset.buffer));
            const probe = JSON.parse(execFileSync('ffprobe',['-v','error','-show_entries','stream=codec_type,codec_name,width,height,avg_frame_rate:format=duration,size','-of','json',output],{encoding:'utf8'}));
            const video = probe.streams.find((s:any)=>s.codec_type==='video');
            assert.equal(video.width,1280); assert.equal(video.height,720);
            assert.ok(Number(probe.format.duration)>=9.8 && Number(probe.format.duration)<=10.5);
            execFileSync('ffmpeg',['-v','error','-i',output,'-f','null','-']);
            const report = {sourceCommit:'0f421efa96d172b3a84037d4dd0f54f5d676c199',provider:provider.name,model:asset.model,scopeId,shotId,submissionsThisRun:submissions,estimatedCostUsd:asset.costUsd,outputSha256:sha(asset.buffer),providerJobId:asset.providerJobId,storagePath:record?.storagePath,reuseVerified:true,decodeVerified:true,probe};
            await fs.writeFile('evidence/runway/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report));
          }
          main().catch(e=>{console.error(e instanceof Error?e.message:'Verification failed');process.exitCode=1;});
          
          TS
          npx tsx .runway-live-smoke.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runway-connection-verification
          path: evidence/runway/
          if-no-files-found: ignore
          retention-days: 14
