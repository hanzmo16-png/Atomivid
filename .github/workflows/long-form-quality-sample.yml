name: Dulce full episode - isolated authorized production
on:
  workflow_dispatch:
    inputs:
      stage:
        description: preflight, narrate or images
        type: choice
        options: [preflight, narrate, images]
        default: preflight
        required: true
      shots:
        description: Image shot IDs, comma-separated (at most 12)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: dulce-full-v1
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Execute isolated stage
        run: npx tsx scripts/dulce-full.ts
        env:
          DULCE_STAGE: ${{ inputs.stage }}
          DULCE_ALLOW_PAID: ${{ inputs.stage != 'preflight' && 'true' || 'false' }}
          DULCE_SHOTS: ${{ inputs.shots }}
          DULCE_OUT: ${{ runner.temp }}/dulce-full
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_EN: nPczCjzI2devNBz1zQrb
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
          VOICE_PROVIDER: elevenlabs
          OPENAI_API_KEY: ${{ inputs.stage == 'images' && secrets.OPENAI_API_KEY || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dulce-full-${{ inputs.stage }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dulce-full/
          retention-days: 14
          if-no-files-found: ignore
