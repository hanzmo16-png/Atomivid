name: Orchestrator readiness check (temporary, presence only)
# Temporary, free, read-only. Runs WITHOUT any environment, so it sees only REPOSITORY-level secrets: it tells
# whether any Google/orchestrator credential is stored where every branch workflow could read it. Prints booleans and
# non-secret variables only, never a secret value. Deleted right after its run.
on:
  push:
    branches: [claude/ops-presence-check]
    paths: [.github/workflows/orchestrator-readiness-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository-level secrets (presence only)
        env:
          S_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          S_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          S_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          S_GOOGLE_OAUTH_PENDING: ${{ secrets.GOOGLE_OAUTH_PENDING }}
          S_GOOGLE_OAUTH_REDIRECT: ${{ secrets.GOOGLE_OAUTH_REDIRECT }}
          S_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          S_GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          S_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          S_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          S_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          S_DRIVE_ACCESS_TOKEN: ${{ secrets.DRIVE_ACCESS_TOKEN }}
          S_YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          S_YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          S_YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          S_ORCH_SECRETS_WRITER_TOKEN: ${{ secrets.ORCH_SECRETS_WRITER_TOKEN }}
          S_ORCH_OPENAI_API_KEY: ${{ secrets.ORCH_OPENAI_API_KEY }}
          S_ORCH_SUPABASE_URL: ${{ secrets.ORCH_SUPABASE_URL }}
          S_ORCH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ORCH_SUPABASE_SERVICE_ROLE_KEY }}
          S_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S_VEO_API_KEY: ${{ secrets.VEO_API_KEY }}
        run: |
          has() { [ -n "$1" ] && echo true || echo false; }
          echo "REPO_LEVEL GOOGLE_OAUTH_CLIENT_ID=$(has "$S_GOOGLE_OAUTH_CLIENT_ID") GOOGLE_OAUTH_CLIENT_SECRET=$(has "$S_GOOGLE_OAUTH_CLIENT_SECRET") GOOGLE_OAUTH_REFRESH_TOKEN=$(has "$S_GOOGLE_OAUTH_REFRESH_TOKEN") GOOGLE_OAUTH_PENDING=$(has "$S_GOOGLE_OAUTH_PENDING") GOOGLE_OAUTH_REDIRECT=$(has "$S_GOOGLE_OAUTH_REDIRECT") GOOGLE_SERVICE_ACCOUNT_JSON=$(has "$S_GOOGLE_SERVICE_ACCOUNT_JSON") GOOGLE_APPLICATION_CREDENTIALS=$(has "$S_GOOGLE_APPLICATION_CREDENTIALS") GOOGLE_CLIENT_ID=$(has "$S_GOOGLE_CLIENT_ID") GOOGLE_CLIENT_SECRET=$(has "$S_GOOGLE_CLIENT_SECRET") GOOGLE_API_KEY=$(has "$S_GOOGLE_API_KEY") GCP_SA_KEY=$(has "$S_GCP_SA_KEY") DRIVE_ACCESS_TOKEN=$(has "$S_DRIVE_ACCESS_TOKEN") YOUTUBE_CLIENT_ID=$(has "$S_YOUTUBE_CLIENT_ID") YOUTUBE_CLIENT_SECRET=$(has "$S_YOUTUBE_CLIENT_SECRET") YOUTUBE_REFRESH_TOKEN=$(has "$S_YOUTUBE_REFRESH_TOKEN") ORCH_SECRETS_WRITER_TOKEN=$(has "$S_ORCH_SECRETS_WRITER_TOKEN") ORCH_OPENAI_API_KEY=$(has "$S_ORCH_OPENAI_API_KEY") ORCH_SUPABASE_URL=$(has "$S_ORCH_SUPABASE_URL") ORCH_SUPABASE_SERVICE_ROLE_KEY=$(has "$S_ORCH_SUPABASE_SERVICE_ROLE_KEY") CLAUDE_CODE_OAUTH_TOKEN=$(has "$S_CLAUDE_CODE_OAUTH_TOKEN") OPENAI_API_KEY=$(has "$S_OPENAI_API_KEY") VEO_API_KEY=$(has "$S_VEO_API_KEY")" | tr ' ' '\n'
      - name: Repository variables (non-secret)
        run: |
          echo "VARS ORCHESTRATOR_ENABLED='${{ vars.ORCHESTRATOR_ENABLED }}' ORCH_ALLOW_PAID_CALLS='${{ vars.ORCH_ALLOW_PAID_CALLS }}' ORCH_CLAUDE_ACTION_ENABLED='${{ vars.ORCH_CLAUDE_ACTION_ENABLED }}' ORCH_STORE='${{ vars.ORCH_STORE }}' ORCH_OPENAI_MODEL='${{ vars.ORCH_OPENAI_MODEL }}'"
      - name: Environment "orchestrator" (existence and branch policy)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /tmp/env.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/environments/orchestrator")
          echo "ENV_HTTP $code"
          if [ "$code" = 200 ]; then jq -c '{deployment_branch_policy, rules: [.protection_rules[]?.type]}' /tmp/env.json; fi
          code=$(curl -s -o /tmp/envs.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/environments")
          echo "ENVS_HTTP $code"; [ "$code" = 200 ] && jq -c '[.environments[]?.name]' /tmp/envs.json || true
