name: Render video (worker de Atomivid)

# Disparado normalmente por /api/generate/[id]/render
# (src/lib/worker/github-actions.ts) vía la API de "repository dispatch" de
# GitHub. También acepta workflow_dispatch (run_workflow por API/CLI/UI)
# con un requestId manual — únicamente para probar el worker end-to-end
# apuntando a una solicitud real ya creada por la app, sin depender de que
# el trigger automático esté configurado. Corre Chromium (Remotion) y
# produce el video final fuera de Vercel, como worker gratuito para
# validar el MVP (ver README, sección "Worker en background").
on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID de la solicitud (video_requests.id) a renderizar"
        required: true
        type: string
      mode:
        description: "Modalidad de la solicitud (vacío = Reel/Avatar). 'long_form' da el timeout y las credenciales de Long Form."
        required: false
        type: string

# Evita que dos renders de la MISMA solicitud corran en paralelo si por lo
# que sea llegara un dispatch duplicado; distintas solicitudes sí corren en
# paralelo entre sí.
concurrency:
  group: atomivid-render-${{ github.event.client_payload.requestId || inputs.request_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # Reel/Avatar: el paso de render tiene 12 minutos y el job deja margen
    # para la limpieza. Long Form (documental 3-30 min, 16:9): evidencia
    # real de VIDEO #001 (~11 min de video) = 32 min solo en el paso de
    # producción; 30 min de documental ≈ 90 min + masterizado/subida, más
    # posibles esperas por límite de búsquedas de stock. 300 min de paso
    # dejan margen dentro del máximo de 360 min de un runner alojado.
    # Un timeout del job entero no ejecutaría la limpieza, por eso el job
    # siempre deja ~15 min más que el paso.
    timeout-minutes: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 330 || 18 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Requerido por audio-master.ts (normalización de loudness del video
      # final a -16 LUFS / -1.5 dBTP) — software libre, sin costo ni
      # suscripción. No viene preinstalado en la imagen ubuntu-latest
      # (verificado contra el inventario de software del runner).
      - name: Instalar ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            test -x node_modules/@ffmpeg-installer/linux-x64/ffmpeg
            echo "$PWD/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          fi
          if ! command -v ffprobe >/dev/null 2>&1; then
            test -f node_modules/@ffprobe-installer/linux-x64/ffprobe
            chmod +x node_modules/@ffprobe-installer/linux-x64/ffprobe
            echo "$PWD/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
          fi

      - name: Renderizar video
        timeout-minutes: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 300 || 12 }}
        run: npx tsx scripts/render-worker.ts
        env:
          ATOMIVID_RUNTIME: production
          REQUEST_ID: ${{ github.event.client_payload.requestId || inputs.request_id }}
          RENDER_ATTEMPT: ${{ github.event.client_payload.renderAttempt }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          # Starter: USD 6 / 30,000 credits, Multilingual v2 = 1 credit/character.
          # Keep the worker aligned with the production app's configured allocation rate.
          PRICING_ELEVENLABS_USD_PER_1K_CHARS: '0.2'
          # QA real (2026-09-25, "AVATAR REAL HEYGEN ATTEMPT FAILED"): esto
          # decía 'false' con el comentario "el worker general nunca
          # habilita avatar" — cierto ANTES del RC mission de Avatar, cuando
          # el único flujo con avatar era la prueba privada D-ID/owner
          # trial (su propio workflow guardado, heygen-owner-trial.yml).
          # Desde que Avatar es un feature self-service real (allowlist
          # canPrepareAvatar aplicado en actions.ts/render/route.ts, antes
          # de que una solicitud llegue aquí), este worker general SÍ es el
          # que procesa avatar de verdad — con esto en 'false',
          # generateAvatarVideo() (pipeline.ts) rechazaba toda generación
          # real en su primerísima línea, antes de contactar a HeyGen, sin
          # costo pero también sin nunca poder completar un video.
          AVATAR_MODE_ENABLED: 'true'
          AVATAR_PROVIDER: 'heygen'
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          MAX_AVATAR_DURATION_SECONDS: '45'
          # Debe ser IGUAL a MAX_AVATAR_COST_USD de Vercel: el inicio reserva ese sobre y el worker
          # no puede pedir más (pi_reserve_job_supply: "job envelope changed"). 2026-10-08: USD 2.
          MAX_AVATAR_COST_USD: '2'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MUSIC_TRACK_URLS: ${{ secrets.MUSIC_TRACK_URLS }}
          MUSIC_PROVIDER: ${{ secrets.MUSIC_PROVIDER }}
          # --- Solo Long Form (vacío para cualquier otra modalidad: Reel/Avatar
          # siguen exactamente igual, nunca reciben estas credenciales) ---
          # Interruptor GLOBAL de gasto real (mode.ts). Hans lo activa creando
          # el secret LONG_FORM_REAL_RUN_CONFIRM=YES_SPEND_REAL_MONEY — nunca
          # se escribe aquí en claro. Además, cada producción exige su propia
          # confirmación humana (long_form_confirmed_at).
          LONG_FORM_REAL_RUN_CONFIRM: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && secrets.LONG_FORM_REAL_RUN_CONFIRM || '' }}
          # Anexo C1: a Reel gets the image provider only when the owner switched on new Director material with the
          # repository variable DIRECTOR_MATERIAL_ENABLED (never from the dispatch payload). It can still only spend what
          # the server reserved for this attempt's image envelope after the owner approved a ceiling.
          IMAGE_PROVIDER: ${{ ((github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') || vars.DIRECTOR_MATERIAL_ENABLED == 'true') && 'openai' || '' }}
          OPENAI_API_KEY: ${{ ((github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') || vars.DIRECTOR_MATERIAL_ENABLED == 'true') && secrets.OPENAI_API_KEY || '' }}
          # Recraft (fal.ai) is chosen per video, for Reels and Long Form. The worker only calls fal when the request row
          # in the database says so (never from this payload); the key alone neither selects nor funds anything.
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # Admin-scoped key for the GET-only balance read (api.fal.ai/v1/account/billing); optional if FAL_KEY is Admin.
          FAL_ADMIN_KEY: ${{ secrets.FAL_ADMIN_KEY }}
          # Who may use a chosen Recraft source, re-checked by the worker from the request's owner (recraft-access.ts):
          # the internal owner account (controlled pilot), or everyone when the repository variable is "true".
          # Recraft-only name on purpose: exposing INTERNAL_PRODUCTION_OWNER_USER_ID here would also switch on other
          # owner-only paths of this worker (Director material) that were never enabled in it.
          RECRAFT_PILOT_OWNER_USER_ID: ${{ secrets.INTERNAL_PRODUCTION_OWNER_USER_ID }}
          RECRAFT_REEL_ENABLED: ${{ vars.RECRAFT_REEL_ENABLED }}
          # Video IA: en el worker se encienden para Long Form y el ÚNICO
          # control es la allocation del plan confirmado (calculada en Vercel
          # con sus propias flags y mostrada al usuario antes de confirmar):
          # con 0 clips confirmados, el worker nunca envía nada a Veo.
          VIDEO_PROVIDER: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 'veo' || '' }}
          PREMIUM_CLIPS_ENABLED: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 'true' || '' }}
          LONG_FORM_AI_VIDEO_ENABLED: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 'true' || '' }}
          RUNWAY_API_KEY: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && secrets.RUNWAY_API_KEY || '' }}
          VEO_API_KEY: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && secrets.VEO_API_KEY || '' }}
          # P0 2026-09-25 (final.mp4 rechazado por tamaño): si la ENTREGA
          # falla, el archivo ya renderizado se copia aquí y el paso de abajo
          # lo publica como artifact — antes vivía solo en el tmpdir del
          # runner y se perdía con él.
          LONG_FORM_OUTPUT_KEEP_DIR: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && format('{0}/long-form-output', runner.temp) || '' }}
          # Techo real de Storage en bytes (variable del repositorio, opcional).
          # Vacío = se intenta subir tal cual y, si Storage rechaza por
          # tamaño, se ajusta desde el mismo archivo al límite demostrado.
          LONG_FORM_STORAGE_MAX_OBJECT_BYTES: ${{ vars.LONG_FORM_STORAGE_MAX_OBJECT_BYTES }}
          # Cinematic V6 (plan v6): el worker vuelve a comprobar la cuenta dueña del trabajo.
          # Vacío = ningún plan v6 se ejecuta (falla cerrado). Mismos valores que en Vercel.
          CINEMATIC_V6_ENABLED_EMAILS: ${{ secrets.CINEMATIC_V6_ENABLED_EMAILS }}
          CINEMATIC_V6_ALL_USERS: ${{ vars.CINEMATIC_V6_ALL_USERS }}
          # Revalidate curator authority in the renderer, using the same configured allowlist as Vercel.
          # Empty configuration remains fail-closed; V6 access never grants curator authority.
          ASSET_CURATOR_EMAILS: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && secrets.ASSET_CURATOR_EMAILS || '' }}
          # Director de Reels (chatgpt-06), piloto. Interruptor = variable del repositorio
          # CINEMATIC_DIRECTOR_RENDER_ENABLED; cuentas = secret CINEMATIC_DIRECTOR_PILOT_EMAILS.
          # Sin alguno de los dos (estado actual) el montaje es el clásico. Nunca para Long Form.
          # run-job.ts vuelve a leer la modalidad y la cuenta dueña de la base: el payload no lo activa.
          CINEMATIC_DIRECTOR_RENDER_ENABLED: ${{ (github.event.client_payload.mode != 'long_form' && inputs.mode != 'long_form') && vars.CINEMATIC_DIRECTOR_RENDER_ENABLED || '' }}
          CINEMATIC_DIRECTOR_PILOT_EMAILS: ${{ (github.event.client_payload.mode != 'long_form' && inputs.mode != 'long_form') && secrets.CINEMATIC_DIRECTOR_PILOT_EMAILS || '' }}

      - name: Marcar como fallido si el render no terminó
        if: failure()
        run: npx tsx scripts/mark-render-failed.ts
        env:
          REQUEST_ID: ${{ github.event.client_payload.requestId || inputs.request_id }}
          RENDER_ATTEMPT: ${{ github.event.client_payload.renderAttempt }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Conservar la salida de Long Form si la entrega falló
        if: failure() && (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: long-form-output-${{ github.event.client_payload.requestId || inputs.request_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/long-form-output/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
