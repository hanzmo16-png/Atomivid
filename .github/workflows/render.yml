name: Render video (worker de Atomivid)

# Disparado normalmente por /api/generate/[id]/render
# (src/lib/worker/github-actions.ts) vía la API de "repository dispatch" de
# GitHub. También acepta workflow_dispatch (run_workflow por API/CLI/UI)
# con un requestId manual — únicamente para probar el worker end-to-end
# apuntando a una solicitud real ya creada por la app, sin depender de que
# el trigger automático esté configurado. Corre Chromium (Remotion) y
# produce el video final fuera de Vercel, como worker gratuito para
# validar el MVP (ver README, sección "Worker en background").
on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID de la solicitud (video_requests.id) a renderizar"
        required: true
        type: string
      mode:
        description: "Modalidad de la solicitud (vacío = Reel/Avatar). 'long_form' da el timeout y las credenciales de Long Form."
        required: false
        type: string

# Evita que dos renders de la MISMA solicitud corran en paralelo si por lo
# que sea llegara un dispatch duplicado; distintas solicitudes sí corren en
# paralelo entre sí.
concurrency:
  group: atomivid-render-${{ github.event.client_payload.requestId || inputs.request_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # Reel/Avatar: el paso de render tiene 12 minutos y el job deja margen
    # para la limpieza. Long Form (documental 3-15 min, 16:9): evidencia
    # real de VIDEO #001 (~11 min de video) = 32 min solo en el paso de
    # producción — 120 min de paso cubren 15 min de documental con margen.
    # Un timeout del job entero no ejecutaría la limpieza, por eso el job
    # siempre deja ~15 min más que el paso.
    timeout-minutes: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 135 || 18 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Requerido por audio-master.ts (normalización de loudness del video
      # final a -16 LUFS / -1.5 dBTP) — software libre, sin costo ni
      # suscripción. No viene preinstalado en la imagen ubuntu-latest
      # (verificado contra el inventario de software del runner).
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Renderizar video
        timeout-minutes: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 120 || 12 }}
        run: npx tsx scripts/render-worker.ts
        env:
          ATOMIVID_RUNTIME: production
          REQUEST_ID: ${{ github.event.client_payload.requestId || inputs.request_id }}
          RENDER_ATTEMPT: ${{ github.event.client_payload.renderAttempt }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          # QA real (2026-09-25, "AVATAR REAL HEYGEN ATTEMPT FAILED"): esto
          # decía 'false' con el comentario "el worker general nunca
          # habilita avatar" — cierto ANTES del RC mission de Avatar, cuando
          # el único flujo con avatar era la prueba privada D-ID/owner
          # trial (su propio workflow guardado, heygen-owner-trial.yml).
          # Desde que Avatar es un feature self-service real (allowlist
          # canPrepareAvatar aplicado en actions.ts/render/route.ts, antes
          # de que una solicitud llegue aquí), este worker general SÍ es el
          # que procesa avatar de verdad — con esto en 'false',
          # generateAvatarVideo() (pipeline.ts) rechazaba toda generación
          # real en su primerísima línea, antes de contactar a HeyGen, sin
          # costo pero también sin nunca poder completar un video.
          AVATAR_MODE_ENABLED: 'true'
          AVATAR_PROVIDER: 'heygen'
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          MAX_AVATAR_DURATION_SECONDS: '45'
          MAX_AVATAR_COST_USD: '5'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MUSIC_TRACK_URLS: ${{ secrets.MUSIC_TRACK_URLS }}
          MUSIC_PROVIDER: ${{ secrets.MUSIC_PROVIDER }}
          # --- Solo Long Form (vacío para cualquier otra modalidad: Reel/Avatar
          # siguen exactamente igual, nunca reciben estas credenciales) ---
          # Interruptor GLOBAL de gasto real (mode.ts). Hans lo activa creando
          # el secret LONG_FORM_REAL_RUN_CONFIRM=YES_SPEND_REAL_MONEY — nunca
          # se escribe aquí en claro. Además, cada producción exige su propia
          # confirmación humana (long_form_confirmed_at).
          LONG_FORM_REAL_RUN_CONFIRM: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && secrets.LONG_FORM_REAL_RUN_CONFIRM || '' }}
          IMAGE_PROVIDER: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 'openai' || '' }}
          OPENAI_API_KEY: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && secrets.OPENAI_API_KEY || '' }}
          # Video IA: en el worker se encienden para Long Form y el ÚNICO
          # control es la allocation del plan confirmado (calculada en Vercel
          # con sus propias flags y mostrada al usuario antes de confirmar):
          # con 0 clips confirmados, el worker nunca envía nada a Veo.
          VIDEO_PROVIDER: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 'veo' || '' }}
          PREMIUM_CLIPS_ENABLED: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 'true' || '' }}
          LONG_FORM_AI_VIDEO_ENABLED: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && 'true' || '' }}
          VEO_API_KEY: ${{ (github.event.client_payload.mode == 'long_form' || inputs.mode == 'long_form') && secrets.VEO_API_KEY || '' }}

      - name: Marcar como fallido si el render no terminó
        if: failure()
        run: npx tsx scripts/mark-render-failed.ts
        env:
          REQUEST_ID: ${{ github.event.client_payload.requestId || inputs.request_id }}
          RENDER_ATTEMPT: ${{ github.event.client_payload.renderAttempt }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
