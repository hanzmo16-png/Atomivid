name: verify-198 (PostgreSQL desechable, evidencia)
on:
  push:
    branches: [claude/verify-198]
permissions: { contents: read }
jobs:
  pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: PostgreSQL desechable + propuesta
        run: |
          set +e
          bash scripts/qa/spend-authorization-db.sh "$RUNNER_TEMP/pgsa" 55901 > pg.log 2>&1; rc=$?
          echo "::notice title=PG::rc=$rc · $(grep -c '^PASS' pg.log) PASS · $(grep -c '^FAIL' pg.log) FAIL · $(tail -n 2 pg.log | tr '\n' ' ' | cut -c1-300)"
          grep '^FAIL' pg.log | head -8 | while read -r l; do echo "::warning title=PG FAIL::${l:0:300}"; done
          echo "::notice title=PG sec::$(grep -E 'PASS .*(privilege|SECURITY|search_path|T10b|T12|durable)' pg.log | cut -c1-120 | tr '\n' '|' | cut -c1-900)"
          echo "::notice title=SHA::$(git rev-parse HEAD~1)"
          exit $rc
