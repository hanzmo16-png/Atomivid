name: Private technical Long Form rerender review (no generation)
on:
  workflow_dispatch:
    inputs:
      new_request_id:
        description: New canonical UUID reserved for root review only; no database row is inserted
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mystery-shopper-real-campaign-320
  cancel-in-progress: false
jobs:
  prepare:
    environment: Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Prepare private review plan from the completed genuine source only
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MYSTERY_SHOPPER_QA_EMAIL: ${{ secrets.MYSTERY_SHOPPER_QA_EMAIL }}
          MYSTERY_SHOPPER_QA_PASSWORD: ${{ secrets.MYSTERY_SHOPPER_QA_PASSWORD }}
          MS_NEW_REQUEST_ID: ${{ inputs.new_request_id }}
          MS_OUT_DIR: ${{ runner.temp }}/technical-rerender-private
        run: |
          umask 077
          node --import tsx scripts/mystery-shopper/prepare-technical-rerender.ts > "$RUNNER_TEMP/technical-rerender-private.log" 2>&1 || { echo 'Private operator review preparation blocked; no row insert or generation.'; exit 1; }
          echo 'Review-only plan stored privately. Root review required before any QA row write or paid generation.'
