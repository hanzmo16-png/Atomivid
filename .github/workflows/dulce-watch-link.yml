name: Dulce master - watch link (read-only, no paid calls)
# Rejoins the verified Storage parts of the reviewed master and signs a 7-day playback URL.
# The URL goes into the artifact file only; printing it would be masked by Actions.
on:
  push:
    branches: [claude/dulce-final-mp4-6jqvxn]
    paths: [scripts/dulce-watch-link.ts, .github/workflows/dulce-watch-link.yml]
permissions:
  contents: read
jobs:
  link:
    if: github.ref == 'refs/heads/claude/dulce-final-mp4-6jqvxn'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx tsx scripts/dulce-watch-link.ts
        env:
          DULCE_OUT: ${{ runner.temp }}/dulce-watch
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dulce-watch-link-${{ github.run_id }}
          path: ${{ runner.temp }}/dulce-watch/
          retention-days: 7
          if-no-files-found: ignore
