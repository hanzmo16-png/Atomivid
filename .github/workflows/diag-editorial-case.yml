name: Read-only editorial case diagnosis (no writes, no provider calls)
on:
  push:
    branches: [claude/hola-sn3dxy]
    paths: [scripts/diag/editorial-case.ts, scripts/diag/editorial-replay.ts, scripts/diag/editorial-scope.ts, .github/workflows/diag-editorial-case.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { path: diag }
      - uses: actions/checkout@v4
        with: { ref: claude/atomivid-mvp-setup-0079jv, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: app
      - uses: actions/checkout@v4
        with: { ref: claude/longform-editorial-unblock, path: fix }
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: fix
      - name: Alcance en todos los trabajos (solo lectura)
        run: cp diag/scripts/diag/editorial-scope.ts app/scripts/diag-editorial-scope.ts && cd app && npx tsx scripts/diag-editorial-scope.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Replay sin proveedor (código original, main)
        run: cp diag/scripts/diag/editorial-replay.ts app/scripts/diag-editorial-replay.ts && cd app && npx tsx scripts/diag-editorial-replay.ts
        env:
          CODE_LABEL: original
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Replay sin proveedor (código corregido)
        run: cp diag/scripts/diag/editorial-replay.ts fix/scripts/diag-editorial-replay.ts && cd fix && npx tsx scripts/diag-editorial-replay.ts
        env:
          CODE_LABEL: corregido
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
