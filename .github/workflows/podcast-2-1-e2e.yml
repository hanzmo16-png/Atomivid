# Podcast 2.1 — pruebas v2 + E2E de navegador con proveedores SIMULADOS. USD 0: no usa ningún secreto del repositorio,
# todo corre en 127.0.0.1 (PG local, PostgREST, mocks de ElevenLabs/Pexels con espeak-ng). La migración propuesta se aplica
# SOLO a la base desechable del runner. Falla si alguna prueba se omite, si un caso no alcanza su mínimo de comprobaciones,
# o si hay tráfico de salida no local.
name: podcast-2-1-e2e
on:
  workflow_dispatch:
    inputs:
      cases: { description: "Casos E2E (coma)", default: "1,2,3,4,5,6,7,8" }
  push:
    branches: [claude/podcast-2-1-closure]
    paths:
      - ".github/workflows/podcast-2-1-e2e.yml"
      - "src/lib/podcast/**"
      - "src/app/dashboard/podcast/**"
      - "src/app/api/podcast/**"
      - "src/lib/supabase/**"
      - "supabase/proposals/20261021200000_podcast_v2_production*.sql"
      - "scripts/harness/e2e/**"
permissions:
  contents: read
concurrency: { group: podcast-2-1-e2e-${{ github.ref }}, cancel-in-progress: true }
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "1"
      E2E_HOME: ${{ github.workspace }}/.e2e-local
      E2E_PGPORT: "55532"
      E2E_TIMEOUT: "5400"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-17 espeak-ng ffmpeg python3-numpy xz-utils
          sudo systemctl stop postgresql || true
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Pruebas Podcast v2 (sin omisiones)
        run: |
          set -o pipefail
          node --import tsx --test src/lib/podcast/v2/v2.test.ts src/lib/podcast/v2/integration.test.ts src/lib/podcast/editor/editor.test.ts \
            src/lib/podcast/episode.test.ts src/lib/podcast/server.test.ts src/lib/video/long-form/production-preflight.test.ts 2>&1 | tee v2-tests.log
          grep -q '^# skipped 0$' v2-tests.log || { echo "::error::hay pruebas omitidas"; exit 1; }
          grep -q '^# todo 0$' v2-tests.log || { echo "::error::hay pruebas todo"; exit 1; }
          grep -q '^# fail 0$' v2-tests.log
      - name: Arnés local
        run: bash scripts/harness/e2e/infra/setup.sh
      - name: Entorno Podcast
        run: bash scripts/harness/e2e/podcast/start.sh
      - name: E2E casos
        run: |
          set -o pipefail
          bash scripts/harness/e2e/podcast/run.sh ci "${{ inputs.cases || '1,2,3,4,5,6,7,8' }}"
          grep -Eq '^RESULTADO ([0-9]+)/\1 PASS$' "$E2E_HOME/out/ci.log" || { echo "::error::E2E con fallos"; exit 1; }
      - name: Ningún proveedor real contactado
        if: always()
        run: |
          # next-intercept.cjs rechaza (no envía) toda salida no local y la registra. Un intento hacia un proveedor de pago
          # o hacia Supabase real indica una ruta sin simular: falla. Otros intentos (p. ej. registro npm de next dev) se listan.
          f="$E2E_HOME/logs/egress.jsonl"; [ -f "$f" ] || exit 0
          grep '"egress_refused"' "$f" | sort -u -t'"' -k10,10 || true
          if grep '"egress_refused"' "$f" | grep -Eiq 'elevenlabs|pexels|fal\.(ai|run)|openai|anthropic|recraft|heygen|d-id|supabase\.co|stripe'; then
            echo "::error::intento de salida hacia un proveedor real"; exit 1; fi
      - name: Evidencia (sin secretos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-2-1-e2e
          retention-days: 7
          path: |
            v2-tests.log
            .e2e-local/out/ci.log
            .e2e-local/out/ci/summary.json
            .e2e-local/logs/*.jsonl
            .e2e-local/logs/next.log
