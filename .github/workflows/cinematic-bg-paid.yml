name: Cinematic background (paid generation, authorized)

# Fondo cinematográfico de la portada: FLUX 1.1 Pro Ultra (imágenes clave) + Veo 3.1 Fast (video 8 s). Solo se ejecuta
# cuando un push cambia ops/cinematic-bg/job.json en la rama de la Cinematic UI; el propio job lleva el tope de gasto.
# Los resultados se suben de vuelta a la rama (ops/cinematic-bg/out/), sin tocar Supabase ni el ledger.
on:
  push:
    branches: [feature/cinematic-ui-experience-v1]
    paths: [ops/cinematic-bg/job.json]
permissions:
  contents: write
concurrency:
  group: cinematic-bg-paid
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          VEO_API_KEY: ${{ secrets.VEO_API_KEY }}
        run: node scripts/cinematic/paid-ambient.mjs
      - name: Push results back to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/cinematic-bg/out
          git diff --cached --quiet && exit 0
          git commit -m "ops(cinematic-bg): resultados de generación $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase --no-edit origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done; exit 1
