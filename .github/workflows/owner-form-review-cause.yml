name: Inspect authorized review cause without private output
on:
  push:
    branches: [codex/vfx-sequence-compositor]
    paths: [scripts/owner-form-review-cause.ts, .github/workflows/owner-form-review-cause.yml]
permissions:
  contents: read
jobs:
  cause:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/owner-form-review-cause.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
