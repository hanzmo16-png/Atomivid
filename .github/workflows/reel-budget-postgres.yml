name: Reel total budget (disposable PostgreSQL)
on:
  pull_request:
    paths:
      - 'src/lib/supply/**'
      - 'src/lib/video/script-error*'
      - 'src/app/dashboard/new/actions.ts'
      - 'src/app/api/generate/**'
      - 'supabase/migrations/**'
      - 'scripts/qa/reel-budget-postgres.ts'
      - '.github/workflows/reel-budget-postgres.yml'
permissions:
  contents: read
jobs:
  reel-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
      SCRIPT_PROVIDER: fixture
      VOICE_PROVIDER: fixture
      FOOTAGE_PROVIDER: fixture
      IMAGE_PROVIDER: fixture
      MUSIC_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: chmod +x node_modules/@ffprobe-installer/linux-x64/ffprobe
      - run: node --import tsx scripts/qa/reel-budget-postgres.ts
      - run: npm run test:spend
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
