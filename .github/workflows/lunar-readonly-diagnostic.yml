name: Lunar block 5 read-only diagnosis
on:
  push:
    branches: [codex/lunar-diagnosis-20261014]
    paths: [.github/workflows/lunar-readonly-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: lunar-readonly-diagnosis-20261014
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read the exact saved block, emit bounded schema diagnosis only
        run: node --import tsx scripts/lunar-readonly-diagnostic.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
