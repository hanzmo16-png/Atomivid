name: Drive OAuth (one-time owner authorization)
# Manual, free. Two runs from the phone: "start" shows Google's consent link; "finish" takes the address the browser
# landed on (http://127.0.0.1…), exchanges it here and stores GOOGLE_OAUTH_REFRESH_TOKEN as a repository secret.
# The token is never printed; the pasted address is read from the event payload, not from env. A token for an account
# that does not own the coordination folder is revoked. See docs/ORCHESTRATOR.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "start = enlace de consentimiento; finish = guardar el token"
        required: true
        default: start
        type: choice
        options: [start, finish]
      redirect_url:
        description: "Solo en finish: la dirección completa que mostró el navegador (http://127.0.0.1:8765/callback?...)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: drive-oauth
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/orchestrator/google-oauth-actions.ts
        env:
          MODE: ${{ inputs.mode }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.ORCH_SECRETS_WRITER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORCH_DRIVE_ROOT: 17GzExKZIgjOTF1Ods0H1AapuRssQ9m8Z
