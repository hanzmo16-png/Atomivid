name: Drive OAuth (one-time owner authorization)
# Manual, free. "start" shows Google's consent link and keeps a random, single-use attempt (state + PKCE verifier) as
# an environment secret; the owner stores the address the phone's browser landed on as the environment secret
# GOOGLE_OAUTH_REDIRECT; "finish" exchanges it, stores GOOGLE_OAUTH_REFRESH_TOKEN in the environment and deletes the
# attempt and the address. No workflow input carries anything secret. Everything runs in the GitHub environment
# "orchestrator", restricted to the default branch (configure it in Settings → Environments). See docs/ORCHESTRATOR.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "start = enlace de consentimiento; finish = guardar el token (después de crear GOOGLE_OAUTH_REDIRECT)"
        required: true
        default: start
        type: choice
        options: [start, finish]
permissions:
  contents: read
  # Reads the "orchestrator" environment's branch policy before any secret is written.
  actions: read
concurrency:
  group: drive-oauth
  cancel-in-progress: false
jobs:
  authorize:
    # Default branch only (the environment's branch policy enforces it too).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: orchestrator
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/orchestrator/google-oauth-actions.ts
        env:
          MODE: ${{ inputs.mode }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_PENDING: ${{ secrets.GOOGLE_OAUTH_PENDING }}
          GOOGLE_OAUTH_REDIRECT: ${{ secrets.GOOGLE_OAUTH_REDIRECT }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.ORCH_SECRETS_WRITER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORCH_DRIVE_ROOT: 17GzExKZIgjOTF1Ods0H1AapuRssQ9m8Z
      # Also on cancel or timeout (Node never reaches its own cleanup then): the single-use code never stays stored.
      - name: Remove the temporary secrets (finish)
        if: always() && inputs.mode == 'finish'
        env:
          GH_TOKEN: ${{ secrets.ORCH_SECRETS_WRITER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          gh secret delete GOOGLE_OAUTH_REDIRECT --env orchestrator --repo "$REPO" >/dev/null 2>&1 || true
          gh secret delete GOOGLE_OAUTH_PENDING --env orchestrator --repo "$REPO" >/dev/null 2>&1 || true
