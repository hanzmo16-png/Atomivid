name: Gucci acceptance (existing job only, visual plans only)
on:
  push:
    branches: [claude/hola-sn3dxy]
    paths: [content/acceptance/gucci.json, scripts/gucci-acceptance.tsx, .github/workflows/gucci-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: gucci-acceptance
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve phase
        id: req
        run: node -e "const r=require('./content/acceptance/gucci.json');if(!['queue','verify'].includes(r.phase))throw Error('phase');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'phase='+r.phase+'\nsince='+(r.since||'')+'\n')"
      - run: npx tsx scripts/gucci-acceptance.tsx
        env:
          PHASE: ${{ steps.req.outputs.phase }}
          SINCE: ${{ steps.req.outputs.since }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
