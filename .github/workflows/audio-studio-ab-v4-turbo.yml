# Audio Podcast Studio — A/B de 90 s Multilingual v2 vs v4 Turbo (misma voz, mismo texto).
# DE PAGO: solo manual y solo si confirmar_usd coincide EXACTAMENTE con el tope que calcula el script (modo fixture).
# Requiere autorización adicional de Hans antes de despacharlo. Usa el secreto existente sin modificarlo.
name: audio-studio-ab-v4-turbo
on:
  workflow_dispatch:
    inputs:
      voz_id: { description: "voice_id de ElevenLabs (la misma para ambos modelos)", required: true }
      confirmar_usd: { description: "Monto exacto autorizado (lo imprime el modo fixture: TOPE_AB_USD)", required: true }
permissions:
  contents: read
concurrency:
  group: audio-studio-ab-v4-turbo
  cancel-in-progress: false
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get -o Acquire::Retries=3 update -q && sudo apt-get install -yq ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: A/B real (tope exacto)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AB_VOZ_ID: ${{ inputs.voz_id }}
          AB_CONFIRMAR_USD: ${{ inputs.confirmar_usd }}
        run: npx tsx scripts/audio-studio/ab-v4-turbo.ts real ab-v4-turbo
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ab-v4-turbo, path: ab-v4-turbo/, if-no-files-found: ignore, retention-days: 30 }
