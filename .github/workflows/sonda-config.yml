# USD 0 · Solo lectura. Sonda firmada del despliegue de producción: presencia de claves de configuración (nunca valores)
# y commit desplegado. No escribe nada.
name: sonda-config
on:
  workflow_dispatch:
  push:
    branches: [claude/puertas-merge]
    paths: [".github/workflows/sonda-config.yml", "scripts/qa/sonda-config.ts"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/qa/sonda-config.ts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
