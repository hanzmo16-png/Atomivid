# READ-ONLY: aggregates of the open paid operations in production (no ids, no user data, nothing written).
name: ops-abiertas-lectura
on:
  push:
    branches: [claude/ops-abiertas-lectura]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -q && sudo apt-get install -yq postgresql-client
      - name: Read-only aggregates
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        run: |
          set -uo pipefail
          URL=$(npx tsx -e 'import { resolveConnection } from "./scripts/lib/supabase-db"; const c = resolveConnection(); if (!c) { process.exit(3) } process.stdout.write(c.connectionString)')
          echo "::add-mask::$URL"
          w=$(printf 'begin transaction read only;\ncreate temp table _p(x int);\nrollback;\n' | psql "$URL" -X -qAt 2>&1)
          echo "$w" | grep -q "read-only transaction" && echo "PASS write probe refused" || { echo "FAIL write probe not refused"; exit 1; }
          { printf 'begin transaction read only;\n'; cat scripts/qa/schema-readonly/open-ops.sql; printf '\nrollback;\n'; } | psql "$URL" -X -v ON_ERROR_STOP=1
