name: Generar biblioteca de música (Eleven Music)

# Workflow de un solo uso: genera 20 pistas instrumentales (2 por cada
# tono de src/lib/providers/types.ts) con la API de música de ElevenLabs
# y las sube al bucket privado `music-library` de Supabase Storage — ver
# scripts/generate-music-library.ts.
#
# Gasto real autorizado explícitamente por el usuario (~$1-3 USD,
# $0.15/min). No modifica manifest.ts directamente: deja un JSON como
# artifact con las entradas listas para revisar y pegar a mano.
on:
  workflow_dispatch: {}

jobs:
  generate-music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar y subir pistas
        run: npx tsx scripts/generate-music-library.ts
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Subir entradas de manifest como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-library-manifest-additions
          path: music-library-manifest-additions.json
          if-no-files-found: warn
          retention-days: 30
