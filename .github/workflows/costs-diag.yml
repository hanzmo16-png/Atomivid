# Consumo de proveedores en solo lectura (USD 0): saldos guardados, saldo actual sin persistir, listado del proveedor y
# operaciones registradas. No inserta snapshots ni escribe en producción.
name: costs-diag
on:
  workflow_dispatch:
    inputs:
      desde: { description: "Inicio del intervalo (UTC, ISO)", required: true }
  push:
    branches: [claude/puertas-merge]
    paths: [".github/workflows/costs-diag.yml"]
permissions:
  contents: read
jobs:
  heygen:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: HeyGen (solo lectura)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          DESDE: ${{ inputs.desde }}
        run: npx tsx scripts/qa/real/heygen-costs.ts
      - name: Recursos para dos identidades (solo lectura)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npx tsx scripts/qa/real/studio-resources.ts
      - name: Valeria y Callie (solo lectura)
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npx tsx scripts/qa/real/valeria-probe.ts
      - name: ¿Puede arrancar un episodio ilustrado? (código de producción, solo lectura)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          FAL_ADMIN_KEY: ${{ secrets.FAL_ADMIN_KEY }}
          ATOMIVID_RUNTIME: production
        run: |
          git fetch -q https://github.com/${{ github.repository }}.git claude/atomivid-mvp-setup-0079jv && git checkout FETCH_HEAD -- src
          npx tsx scripts/qa/real/pod-ready.ts
