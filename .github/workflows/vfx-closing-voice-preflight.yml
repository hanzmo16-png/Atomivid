name: VFX private voice conversion preflight
on:
  push:
    branches: [codex/vfx-sequence-compositor]
    paths: [scripts/vfx/closing-voice-preflight.ts]
permissions:
  contents: read
concurrency:
  group: vfx-closing-voice-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m pip install faster-whisper==1.2.0 av==15.1.0
      - run: node --import tsx scripts/vfx/closing-voice-preflight.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
