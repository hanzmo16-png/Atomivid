# USD 0 · PRODUCCIÓN SOLO SE LEE. Ensayo de O8 (migración 20261024140000) en PostgreSQL 17 desechable con los MISMOS
# comandos del workflow de ejecución (o8.sh); O3 se aplica antes en la réplica (o3.sh apply), como exige el orden O3 → O8.
name: o8-ensayo-replica
on:
  push:
    branches: [claude/o8-ejecucion-unica]
    paths: [".github/workflows/o8-*.yml", "scripts/qa/schema-readonly/o3*.sh", "scripts/qa/schema-readonly/o8*.sh", "scripts/qa/schema-readonly/harness-lib*.sh", "scripts/qa/schema-readonly/gate*.py", "scripts/qa/schema-readonly/cierre.sh", "docs/ops/o8/**", "supabase/migrations/20261024140000_podcast_v3_studio.sql", "supabase/proposals/20261024140000_podcast_v3_studio*.sql"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: o8-ensayo-replica
  cancel-in-progress: false
jobs:
  ensayo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
      SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Hashes y pruebas offline
        run: |
          sha256sum -c docs/ops/o8/SHA256SUMS && sha256sum -c docs/ops/o3/SHA256SUMS && sha256sum -c docs/ops/cierre/SHA256SUMS
          python3 -I scripts/qa/schema-readonly/gate_test.py && python3 -I scripts/qa/schema-readonly/reconcile_test.py && bash scripts/qa/schema-readonly/o8-postgate_test.sh
      - name: Regresión del arnés (un error inesperado o una comprobación inexistente nunca termina en 0 FAIL)
        run: bash scripts/qa/schema-readonly/harness-lib_test.sh
      - name: PostgreSQL 17
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -yq postgresql-17
          sudo systemctl stop postgresql || true
      - name: Ensayo O8 en réplica desechable (O3 aplicado antes en la réplica; escrituras solo locales)
        run: bash scripts/qa/schema-readonly/o8-replica.sh
