name: Bigfoot recovery operations (owner-authorized)
# One audited operation per commit: the mode is read from ops/bigfoot-recovery.mode.
# No provider key is ever passed here; paid work only happens on the deployed app via the documentary worker.
on:
  push:
    branches: [claude/hola-sn3dxy]
    paths: [ops/bigfoot-recovery.mode]
permissions:
  contents: read
concurrency:
  group: bigfoot-recovery-ops
  cancel-in-progress: false
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Operation
        id: op
        run: |
          MODE="$(head -1 ops/bigfoot-recovery.mode | tr -d '[:space:]')"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          BIGFOOT_OPS_MODE="$MODE" npx tsx scripts/bigfoot-recovery-ops.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          CINEMATIC_V6_ENABLED_EMAILS: ${{ secrets.CINEMATIC_V6_ENABLED_EMAILS }}
          CINEMATIC_V6_ALL_USERS: ${{ vars.CINEMATIC_V6_ALL_USERS }}
      - name: Drive the queued job on the deployed app (same signed worker as the dispatch)
        if: steps.op.outputs.mode == 'recover'
        run: npx tsx scripts/documentary-script-worker.ts
        env:
          SCRIPT_JOB_ID: 03738404-02ce-440a-a588-cb51ae4a0e9f
          SCRIPT_PROBE_ONLY: "false"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: State after the operation
        if: always()
        run: BIGFOOT_OPS_MODE=status npx tsx scripts/bigfoot-recovery-ops.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
