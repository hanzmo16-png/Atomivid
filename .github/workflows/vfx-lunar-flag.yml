name: VFX authorized fixed lunar flag
on:
  push:
    branches: [codex/vfx-sequence-compositor]
    paths: [docs/production-intelligence/VFX-LUNAR-FLAG-GENERATION.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vfx-approved-first-frames
  cancel-in-progress: false
jobs:
  flag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/vfx/remote_preflight.py
        env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      - run: node --import tsx scripts/vfx/lunar-flag.ts
        env:
          VFX_DIRECTOR_ENABLED: '1'
          AVATAR_PREPARATION_OWNER_EMAIL: hanzmo16@gmail.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfx-lunar-flag-background-review
          path: vfx-flag-review/
          retention-days: 7
