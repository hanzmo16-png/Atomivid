# Audio Podcast Studio 1.0 — pruebas unitarias y de render, tipos, lint y recorrido E2E en Samsung 390x844 y escritorio
# 1440x900 con el arnés local (PG, PostgREST, gateway con Storage local, proveedores simulados). USD 0: no usa ningún secreto
# del repositorio y falla si hay salida hacia un proveedor real.
name: audio-podcast-studio
on:
  workflow_dispatch:
  pull_request:
    branches: [claude/atomivid-mvp-setup-0079jv]
    paths:
      - ".github/workflows/audio-podcast-studio.yml"
      - "scripts/harness/e2e/audio-studio/**"
      - "scripts/audio-studio/**"
      - ".github/workflows/audio-studio-worker.yml"
      - ".github/workflows/audio-studio-ab-v4-turbo.yml"
      - "src/lib/audio-studio/**"
      - "src/app/dashboard/audio-studio/**"
      - "src/app/api/audio-studio/**"
      - "src/app/dashboard/layout.tsx"
permissions:
  contents: read
concurrency:
  group: audio-podcast-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  estudio:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "1"
      E2E_HOME: ${{ github.workspace }}/.e2e-local
      E2E_PGPORT: "55532"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Podcast Studio Premium intacto (ningún archivo de Premium en el PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=200 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(src/lib/podcast|src/app/dashboard/podcast|src/app/api/podcast|src/components/podcast|supabase)/' || true)
          if [ -n "$changed" ]; then echo "::error::el PR modifica archivos de Premium o de base de datos:"; echo "$changed"; exit 1; fi
          echo "::notice title=premium-intacto::0 archivos de Premium o supabase/ en el PR"
      - name: Tipos y lint del módulo
        run: |
          npx next typegen && npm run typecheck
          npx eslint --max-warnings 0 src/lib/audio-studio src/app/dashboard/audio-studio src/app/api/audio-studio src/app/dashboard/layout.tsx
      - name: Dependencias del sistema
        timeout-minutes: 20
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-17 espeak-ng ffmpeg xz-utils
          sudo systemctl stop postgresql || true
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: Pruebas unitarias, de render y de generación con ffmpeg real (sin omisiones)
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 src/lib/audio-studio/*.test.ts src/app/dashboard/audio-studio/*.test.tsx 2>&1 | tee audio-studio-tests.log
          grep -q '^# skipped 0$' audio-studio-tests.log && grep -q '^# todo 0$' audio-studio-tests.log && grep -q '^# fail 0$' audio-studio-tests.log
      - name: Arnés local
        run: bash scripts/harness/e2e/infra/setup.sh
      - name: Entorno (Next 3300) con voz de prueba local y worker en proceso
        env:
          AUDIO_STUDIO_VOICE: fixture
          AUDIO_STUDIO_WORKER: inline
          AUDIO_STUDIO_FIXTURE_FAIL_MARK: "[[falla-proveedor]]"
        run: bash scripts/harness/e2e/podcast/start.sh
      - name: Progreso visible y respuesta perdida (390x844 y 1440x844, API simulada)
        run: |
          . "$E2E_HOME/paths.env"
          E2E_CHROME="$CHROME" PLAYWRIGHT_MODULE="$E2E_HOME/deps/node_modules/playwright" \
            node scripts/harness/e2e/audio-studio/progress-e2e.cjs
      - name: Recorrido E2E del estudio (390x844 y 1440x900)
        run: |
          set -o pipefail
          . "$E2E_HOME/paths.env"; mkdir -p "$E2E_HOME/out/audio-studio"
          E2E_OUT="$E2E_HOME/out/audio-studio" E2E_BASE=http://127.0.0.1:3300 E2E_STORAGE_DIR="$E2E_HOME/storage" E2E_EGRESS_LOG="$E2E_HOME/logs/egress.jsonl" \
            E2E_CHROME="$CHROME" PLAYWRIGHT_MODULE="$E2E_HOME/deps/node_modules/playwright" \
            timeout 3600 node scripts/harness/e2e/audio-studio/audio-studio-e2e.cjs 2>&1 | tee "$E2E_HOME/out/audio-studio.log"
          grep -q '^RESULTADO OK' "$E2E_HOME/out/audio-studio.log"
          echo "::notice title=audio-podcast-studio::$(grep -E '^RESULTADO' "$E2E_HOME/out/audio-studio.log" | tail -1)"
      - name: Ningún proveedor real contactado
        if: always()
        run: |
          f="$E2E_HOME/logs/egress.jsonl"; [ -f "$f" ] || exit 0
          if grep '"egress_refused"' "$f" | grep -Eiq 'elevenlabs|pexels|fal\.(ai|run)|openai|anthropic|recraft|heygen|d-id|supabase\.co|stripe'; then
            echo "::error::intento de salida hacia un proveedor real"; exit 1; fi
      - name: Evidencia (capturas y registros; sin secretos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-podcast-studio
          retention-days: 14
          path: |
            audio-studio-tests.log
            .e2e-local/out/audio-studio
            .e2e-local/out/audio-studio.log
            .e2e-local/logs/next.log
            .e2e-local/logs/gateway.jsonl
