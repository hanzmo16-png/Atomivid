# USD 0. Offline reconciliation plan (T-20261025-0112-chatgpt-03): unit tests + cross-check against the proposed tool on
# a disposable PostgreSQL with synthetic rows. No secrets, no production connection.
name: plan-conciliacion-offline
on:
  push:
    branches: [claude/plan-conciliacion-offline]
  pull_request:
    paths: ["scripts/qa/conciliacion/plan/**", "docs/ops/conciliacion/**", ".github/workflows/plan-conciliacion-offline.yml"]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Integrity (SHA256SUMS)
        run: sha256sum -c scripts/qa/conciliacion/plan/SHA256SUMS && sha256sum -c docs/ops/conciliacion/SHA256SUMS
      - name: Unit tests (offline)
        run: python3 -I -W error scripts/qa/conciliacion/plan/plan_test.py
      - name: PostgreSQL 16 (disposable)
        run: test -x /usr/lib/postgresql/16/bin/initdb || { sudo apt-get update -q && sudo apt-get install -yq postgresql-16; }; sudo systemctl stop postgresql || true
      - name: Cross-check against the proposed tool (synthetic rows only)
        run: set -o pipefail; PG_BIN=/usr/lib/postgresql/16/bin bash scripts/qa/conciliacion/plan/pg_check.sh "$RUNNER_TEMP/plan" 55981 2>&1 | grep -vE 'NOTICE|^psql:' | tee pg_check.log
