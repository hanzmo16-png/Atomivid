name: VFX owner lunar flag review import
on:
  push:
    branches: [codex/vfx-sequence-compositor]
    paths: [scripts/vfx/register-flag-review.ts]
permissions:
  contents: read
concurrency:
  group: vfx-owner-review-registry
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/vfx/register-flag-review.ts
        env:
          VFX_DIRECTOR_ENABLED: '1'
          AVATAR_PREPARATION_OWNER_EMAIL: hanzmo16@gmail.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
